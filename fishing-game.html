    const y = y0 + 2 + (i % 6) * 3;
    c.globalAlpha = 0.50 * (1 - ph/0.45);
    pxPix(x, y, '#ffffff');
    c.globalAlpha = 1;
  }
}

/** 长弯竿（图像模式）：从底图钓手手部伸向左上，大弧弯垂
 *  在彩色底图上竿必须够粗够深才读得清（参考图竿是深褐细杆 + 明显弯曲） */
function pxDrawImgRod(ang, pull, thick){
  const c = PX.ctx;
  const handX = PX.L.rodHandX, handY = PX.L.rodHandY + PX.bgBob;
  const len = PX.ROD_LEN;
  const a = ang * Math.PI/180;
  const ex = handX + Math.cos(a)*len, ey = handY + Math.sin(a)*len;
  const sag = PX.ROD_SAG + pull;
  const steps = Math.round(len * 1.5);
  const t = thick || 3;
  // 竿从「手中」开始：根部后移 6px 藏进握把，避免竿根悬空
  const bx = handX - Math.cos(a)*6, by = handY - Math.sin(a)*6;
  for(let i=0;i<=steps;i++){
    const k = i/steps;
    const bend = sag * Math.pow(k, 1.55);
    const xx = Math.round(bx + (ex-bx)*k);
    const yy = Math.round(by + (ey-by)*k + bend);
    // 根部深褐 → 竿梢浅木色；整体比底图暗一档以保证对比
    const col = pxMix('#2a1c10', '#b98c52', Math.min(1, k*1.4));
    const w = k > 0.82 ? Math.max(1, t-1) : t;      // 竿梢略细
    pxRect(xx, yy, w, w, col);
    pxRect(xx, yy + w, w, 1, '#160d07');            // 下缘深色描边（关键：防与底图混色）
    if(i % 30 === 0 && i>0) pxPix(xx, yy-1, '#e8c98c');
  }
  // 握把 + 卷线器（参考图有明确的轮座与线轮）
  pxRect(handX-5, handY-4, 12, 9, '#241708');
  pxRect(handX-3, handY+5, 9, 8, '#39464e');
  pxRect(handX-2, handY+6, 7, 5, '#93a0a8');
  pxPix(handX+2, handY+9, '#dfeaf2');
  // ---- 握竿的手（压在竿根之上，把竿和人物连起来）----
  // 肤色取自底图钓手手部实测色；袖口用救生衣的橙红
  pxRect(handX-4, handY-3, 9, 7, '#3a2a1c');            // 手轮廓
  pxRect(handX-3, handY-2, 7, 5, '#d9a878');            // 手掌
  pxRect(handX+3, handY-1, 2, 3, '#d9a878');            // 握指（包住竿）
  pxRect(handX+3, handY-1, 2, 1, '#b8875c');            // 指缝
  pxRect(handX-4, handY+2, 3, 3, '#c49064');            // 手下缘阴影
  pxRect(handX-7, handY-1, 4, 6, '#b8442a');            // 袖口（橙红救生衣）
  pxRect(handX-7, handY-1, 4, 2, '#d4573a');            // 袖口受光
  PX._rodEx = ex; PX._rodEy = ey;
  return {ex, ey};
}

/** 钓线（图像模式）：二次贝塞尔，可给中段垂度，1~2px 浅色 */
function pxDrawImgLine(x1,y1,x2,y2,sag,thick){
  const steps = Math.max(2, Math.round(Math.hypot(x2-x1, y2-y1)));
  const t = thick || 1;
  const mx = (x1+x2)/2, my = (y1+y2)/2 + (sag||0);
  for(let i=0;i<=steps;i++){
    const k = i/steps, ik = 1-k;
    const xx = ik*ik*x1 + 2*ik*k*mx + k*k*x2;
    const yy = ik*ik*y1 + 2*ik*k*my + k*k*y2;
    pxRect(Math.round(xx), Math.round(yy), t, t, '#e8f2f8');
  }
}

/** 浮漂（图像模式）：橙球 + 黑顶 + 白腰，带水中倒影（参考图的圆浮球） */
function pxDrawImgBobber(x, y){
  const c = PX.ctx;
  const sy = PX.L.surfY;
  // 水下倒影（模糊竖条）
  if(y > sy - 3){
    c.globalAlpha = 0.24;
    for(let i=0;i<9;i++){
      pxRect(x-3 + Math.round(Math.sin(PX.frame*0.18+i)*2), y + 8 + i, Math.max(1, 7-i*0.7)|0, 1, '#6d8496');
    }
    c.globalAlpha = 1;
  }
  // 球体（放大到 12px 直径，参考图浮球在画面中清晰可辨）
  pxRect(x-6, y-7, 12, 15, '#d8862a');
  pxRect(x-7, y-4, 14, 9, '#f0a63a');
  pxRect(x-6, y-8, 12, 3, '#f6bc5e');
  pxRect(x-6, y+7, 12, 3, '#a85f16');
  // 顶部黑点
  pxRect(x-3, y-11, 6, 3, '#232323');
  // 高光
  pxRect(x-3, y-6, 3, 4, '#ffe4b0');
  pxPix(x-2, y-5, '#fff2d4');
  // 吃水线
  pxRect(x-8, sy, 16, 2, 'rgba(255,255,255,0.28)');
}

/** 同心涟漪环（参考图标志性的大圈水纹） */
function pxDrawImgRings(cx, cy, maxR, n, alpha, speed){
  const c = PX.ctx;
  const sp = speed || 0.9;
  for(let i=0;i<n;i++){
    const rr = ((PX.frame*sp + i*(maxR/n)) % maxR);
    if(rr < 3) continue;
    const a = alpha * (1 - rr/maxR);
    if(a <= 0.01) continue;
    c.globalAlpha = a;
    const seg = Math.max(18, Math.round(rr*1.2));
    for(let g=0; g<seg; g++){
      const ang = g/seg*Math.PI*2;
      pxPix(Math.round(cx + Math.cos(ang)*rr*1.85),
            Math.round(cy + Math.sin(ang)*rr*0.36), '#d6ecfa');
    }
    c.globalAlpha = 1;
  }
}

/** 鱼身（图像模式）：纺锤形像素鱼（逐列厚度曲线），背鳍/叉尾/鳃线/眼，
 *  可整体旋转用于跃出水面；opt: {big, pearl, alpha, look}
 *  look = pxFishLook() 生成的鱼种外观：决定体形/配色/花纹/嘴须，
 *  不传则按传入的纯色绘制（兼容鱼群剪影等群演场景）。 */
function pxDrawImgFish(cx, cy, col, dirDeg, scale, opt){
  opt = opt || {};
  const look = opt.look;
  const c = PX.ctx;
  /* 放大到能看清「是一条鱼」的尺寸：普通 46→64，巨物 96→110 */
  let L = Math.round((opt.big ? 110 : 64) * (scale || 1));
  let H = Math.max(8, Math.round(L * 0.40));
  /* 体形档位：鳗形细长 / 短圆憨厚 / 修长挺拔 / 巨物宽厚 */
  if(look){
    if(look.shape === 'eel'){ L = Math.round(L*1.18); H = Math.max(7, Math.round(H*0.60)); }
    else if(look.shape === 'chub'){ L = Math.round(L*0.88); H = Math.round(H*1.32); }
    else if(look.shape === 'long'){ L = Math.round(L*1.12); H = Math.max(8, Math.round(H*0.80)); }
    else if(look.shape === 'whale'){ H = Math.round(H*1.42); }
  }
  const midC = (look && look.mid) ? look.mid : col;
  const hi  = pxMix(midC, '#f2fbff', 0.62);  // 腹部亮（受水光）
  const lo  = pxMix(midC, '#0b1a28', 0.52);  // 背部深
  const fin = pxMix(midC, '#0b1a28', 0.28);  // 鳍
  c.save();
  c.translate(Math.round(cx), Math.round(cy));
  if(opt.alpha != null) c.globalAlpha = opt.alpha;
  /* 朝向处理：鱼身在局部坐标系里是「背朝上、头朝右」绘制的。
     纯 rotate(180°) 朝左会让鱼背翻到下面（肚子朝上），
     因此朝左分量时改为「水平镜像 + 补偿旋转」：鱼头指向不变，鱼背始终朝上。 */
  if(Math.cos(dirDeg * Math.PI/180) < 0){
    c.rotate((dirDeg - 180) * Math.PI/180);
    c.scale(-1, 1);
  }else{
    c.rotate(dirDeg * Math.PI/180);
  }
  const nose = L * 0.5, tail = -L * 0.5;

  /* ---------- 躯干：用「逐列厚度曲线 + 上下分层」画出有体积的鱼身 ----------
     关键：头部钝圆、背鳍前最厚、尾柄急剧收窄，配合背深腹亮才有鱼的样子 */
  const cols = Math.round(L);
  for(let i=0;i<cols;i++){
    const k = i/cols;                                  // 0=尾柄 → 1=吻端
    // 厚度曲线：尾柄细 → 体中段最厚 → 吻端收圆
    let th;
    if(k < 0.16)      th = H * (0.14 + k*0.55);        // 尾柄
    else if(k < 0.62) th = H * (0.23 + 0.62 * Math.sin((k-0.16)/0.46 * Math.PI * 0.72));
    else              th = H * (0.85 - 0.62 * Math.pow((k-0.62)/0.38, 1.7)); // 头→吻收窄
    th = Math.max(2, Math.round(th));
    const yTop = -Math.round(th/2);
    // 背→腹三段渐变（背深 / 中 / 腹亮），比单色更有立体感
    const b1 = Math.max(1, Math.round(th*0.34)), b3 = Math.max(1, Math.round(th*0.30));
    const b2 = Math.max(1, th - b1 - b3);
    pxRect(tail + i, yTop, 1, b1, lo);
    pxRect(tail + i, yTop + b1, 1, b2, midC);
    pxRect(tail + i, yTop + b1 + b2, 1, b3, hi);
    // 鱼种花纹：竖纹 / 横带（沿体侧，跟厚度走）
    if(look && look.patType === 2 && th > 6 && (i % 7 === 3)){
      c.globalAlpha = 0.40;
      pxRect(tail + i, yTop + 2, 1, Math.max(2, th - 5), look.patCol);
      c.globalAlpha = 1;
    }else if(look && look.patType === 3 && th > 8 && (i % 9 === 4)){
      c.globalAlpha = 0.48;
      pxRect(tail + i, yTop + 1, 1, th - 2, look.patCol);
      c.globalAlpha = 1;
    }
    // 鳞纹：体侧横向暗纹（沿身体走向，强化「鱼」的质感）
    if(th > 8 && (i % 5 === 0)){
      c.globalAlpha = 0.16;
      pxRect(tail + i, yTop + 2, 1, th - 4, '#0a1420');
      c.globalAlpha = 1;
    }
  }
  /* 斑点花纹（循环外按种子布点，同名鱼点位恒定） */
  if(look && look.patType === 1){
    c.globalAlpha = 0.52;
    for(let i=0;i<6;i++){
      const sxp = tail + Math.round(cols * (0.18 + ((i*0.31 + (look.seed%13)/13 * 0.17) % 0.62)));
      const syp = -Math.round(H*0.22) + ((i*5 + (look.seed%7)) % Math.max(2, Math.round(H*0.5)));
      pxRect(sxp, syp, 2, 2, look.patCol);
    }
    c.globalAlpha = 1;
  }
  /* ---------- 尾鳍：分叉新月形（鱼最标志性的部位）---------- */
  const tw = Math.max(4, Math.round(L * 0.20));
  for(let i=0;i<tw;i++){
    const k = i/tw;                                     // 0=尾柄侧 → 1=末端
    const spread = Math.round(H * (0.34 + k*0.62));     // 越往外分叉越开
    pxRect(tail - tw + i, -spread, 1, Math.round(H*0.26), fin);   // 上叶
    pxRect(tail - tw + i, Math.round(H*0.10), 1, Math.round(H*0.26) , fin); // 下叶
    pxRect(tail - tw + i, -Math.round(H*0.06), 1, Math.round(H*0.16), fin); // 中央连接
    if(k > 0.7){                                        // 末端薄而透亮
      c.globalAlpha = 0.55;
      pxRect(tail - tw + i, -spread - 1, 1, 2, hi);
      pxRect(tail - tw + i, Math.round(H*0.10) + Math.round(H*0.26) - 1, 1, 2, hi);
      c.globalAlpha = 1;
    }
  }
  /* ---------- 背鳍：三角帆状 ---------- */
  const d0 = Math.round(cols * 0.34), dl = Math.max(5, Math.round(cols * 0.30));
  for(let i=0;i<dl;i++){
    const k = i/dl;
    const hh = Math.max(1, Math.round(H * 0.34 * Math.sin(k * Math.PI * 0.92)));
    const th = Math.max(3, Math.round(H * (k < 0.16 ? 0.5 : 0.85)));
    pxRect(tail + d0 + i, -Math.round(th/2) - hh, 1, hh + 1, fin);
  }
  /* ---------- 臀鳍（腹下）---------- */
  const a0 = Math.round(cols * 0.28), al = Math.max(4, Math.round(cols * 0.14));
  for(let i=0;i<al;i++){
    const k = i/al;
    const hh = Math.max(1, Math.round(H * 0.20 * Math.sin(k * Math.PI)));
    pxRect(tail + a0 + i, Math.round(H*0.42), 1, hh, fin);
  }
  /* ---------- 胸鳍：贴体侧的一片 ---------- */
  const px0 = Math.round(cols * 0.40);
  for(let i=0;i<Math.max(3, Math.round(L*0.13)); i++){
    const k = i/Math.max(3, Math.round(L*0.13));
    pxRect(tail + px0 + i, Math.round(H*0.18 + k*H*0.22), 1, Math.max(2, Math.round(H*0.22*(1-k*0.5))), fin);
  }
  /* ---------- 头：眼 / 鳃盖 / 嘴 ---------- */
  const ex = tail + Math.round(cols * 0.78);
  const eyy = -Math.round(H * 0.13);
  pxRect(ex - 1, eyy - 1, 6, 6, '#f4fbff');             // 眼白
  pxRect(ex, eyy, 4, 4, '#0d1a24');                     // 瞳孔
  pxPix(ex + 1, eyy + 1, '#ffffff');                    // 眼神光
  // 鳃盖弧线
  const gx = tail + Math.round(cols * 0.66);
  for(let i=0;i<Math.max(3, Math.round(H*0.52)); i++){
    const off = Math.round(Math.sin(i/Math.max(3, H*0.52) * Math.PI) * 3);
    pxRect(gx - off + 1, -Math.round(H*0.30) + i, 1, 1, lo);
  }
  // 嘴（被钩住的地方：一条短横线 + 微微张开）
  pxRect(tail + cols - 3, -Math.round(H*0.04), 3, 2, lo);
  pxRect(tail + cols - 4, Math.round(H*0.04), 3, 1, '#2a1a12');
  // 嘴须（鲶/鲤/龙系）：上下各一根，垂坠感
  if(look && look.whisker){
    const wx = tail + cols - 2;
    pxPix(wx, Math.round(H*0.10) + 1, fin);
    pxPix(wx + 1, Math.round(H*0.10) + 3, fin);
    pxPix(wx + 2, Math.round(H*0.10) + 4, fin);
    pxPix(wx, -Math.round(H*0.08) - 1, fin);
    pxPix(wx + 1, -Math.round(H*0.08) - 3, fin);
  }
  /* ---------- 珠光闪烁 ---------- */
  if(opt.pearl){
    for(let i=0;i<20;i++){
      const sx = tail + ((PX.frame * 1.6 + i * 23) % cols);
      const sy2 = -Math.round(H*0.45) + ((i * 7) % Math.max(2, Math.round(H*0.9)));
      c.globalAlpha = 0.55 + Math.sin(PX.frame * 0.3 + i) * 0.35;
      pxPix(sx, sy2, i % 3 === 0 ? '#ffe9a8' : (i % 3 === 1 ? '#b8f0ff' : '#ffb8e8'));
      c.globalAlpha = 1;
    }
  }
  c.restore();
  if(opt.alpha != null) c.globalAlpha = 1;
}

/** 水花（图像模式）：白蓝色放射状飞溅，参考图出水处的大簇水花 */
/** 活狗（覆盖底图那只静止的狗）：摇尾 + 点头 + 耳朵晃 + 随船起伏
 *  底图狗占 x419-473 / y225-275，这里画一只同姿态、略大一圈的活狗完全盖住它，
 *  边缘按船内木板色收口，不会露出旧狗的残影。 */
function pxDrawImgDog(){
  const c = PX.ctx;
  const D = PX.IMG_DOG;
  const t = PX.frame;
  // 随船起伏；另加自身重心微晃
  const bob = PX.bgBob + Math.sin(t*0.09) * 0.9;
  const cx = D.x + D.w/2;
  const baseY = D.y + D.h;                       // 脚底基准
  // 运动量
  const wag   = Math.sin(t * 0.30);              // 尾巴摆动（快）
  const headB = Math.sin(t * 0.085) * 1.6;       // 头部起伏（慢）
  const earA  = Math.sin(t * 0.22 + 1.2);        // 耳朵晃动
  const blink = (t % 96) < 4;                    // 偶尔眨眼
  const breathe = Math.sin(t * 0.06) * 0.6;      // 胸腔起伏
  const y = Math.round(baseY + bob);

  const S = '#4a3a22', BODY = '#d9a548', BODY2 = '#c68f38', BODY3 = '#a8762f';
  const CREAM = '#f0dcae', NOSE = '#2b1e14', COLLAR = '#c23b2e', COLLAR2 = '#e2574a';
  const hb = Math.round(headB);

  /* ---- 尾巴（身体之后画，甩动幅度大）---- */
  const tw = Math.round(wag * 10);
  for(let i=0;i<10;i++){
    const k = i/9;
    const tx = Math.round(cx + 14 + k*10);
    const ty = Math.round(y - 36 + k*(-12 - tw));
    const w = 5 - Math.round(k*2);
    pxRect(tx, ty, w, w, k > 0.55 ? CREAM : BODY2);
    pxRect(tx, ty, 1, w, S);                        // 上缘描边
  }
  /* ---- 躯干：坐姿，胸朝左（头小身大，比例才像狗）---- */
  pxRect(cx-13, y-32, 28, 29, S);                          // 轮廓
  pxRect(cx-12, y-31, 26, 27, BODY);
  pxRect(cx-12, y-31, 26, 5, BODY2);                       // 背脊暗部
  pxRect(cx-11, y-26 + Math.round(breathe), 20, 18, BODY2);// 体侧
  pxRect(cx-9,  y-22 + Math.round(breathe), 12, 12, CREAM);// 胸口奶白（只占前胸）
  pxRect(cx-12, y-8, 26, 4, BODY3);                        // 底缘暗
  /* ---- 前后腿与爪 ---- */
  pxRect(cx-11, y-13, 8, 11, BODY);                        // 前腿
  pxRect(cx-11, y-12, 8, 2, BODY2);
  pxRect(cx-12, y-4, 11, 4, CREAM);                        // 前爪
  pxRect(cx-12, y-1, 11, 1, S);
  pxRect(cx+3, y-12, 9, 10, BODY2);                        // 后腿（屈坐）
  pxRect(cx+2, y-3, 11, 4, CREAM);                         // 后爪
  pxRect(cx+2, y+0, 11, 1, S);
  pxRect(cx-1, y-14, 5, 8, BODY3);                         // 大腿分界
  /* ---- 项圈 ---- */
  pxRect(cx-11, y-31 + hb, 24, 3, COLLAR);
  pxRect(cx-11, y-31 + hb, 24, 1, COLLAR2);
  pxPix(cx, y-29 + hb, '#ffd98a');                         // 铃铛
  /* ---- 头（对齐底图狗实测：头顶 y≈233，头宽 26，头小身大）---- */
  const hy = Math.round(y - 43 + headB);
  pxRect(cx-16, hy, 26, 20, S);                            // 头轮廓
  pxRect(cx-15, hy+1, 24, 18, BODY);
  pxRect(cx-15, hy+1, 24, 3, BODY2);                       // 额顶暗
  pxRect(cx-14, hy+14, 18, 4, CREAM);                      // 下颌窄条
  /* 口鼻：向左前伸，短而钝 */
  pxRect(cx-23, hy+9, 9, 8, S);
  pxRect(cx-22, hy+10, 8, 6, BODY);
  pxRect(cx-22, hy+13, 8, 3, CREAM);                       // 吻部亮
  pxRect(cx-25, hy+11, 4, 4, NOSE);                        // 鼻头
  pxPix(cx-24, hy+12, '#8a6a55');                          // 鼻孔高光
  pxRect(cx-20, hy+15, 5, 1, NOSE);                        // 嘴线
  /* 耳：贴在头两侧上缘的垂耳（不再是头顶凸块） */
  const ed = Math.round(earA * 1.5);
  pxRect(cx-16, hy+5 + ed, 5, 9, S);
  pxRect(cx-15, hy+6 + ed, 3, 7, BODY3);
  pxRect(cx+8,  hy+4 - ed, 5, 10, S);
  pxRect(cx+9,  hy+5 - ed, 3, 8, BODY3);
  /* 眼：小而圆，间距靠前 */
  const eyy = hy + 8;
  pxRect(cx-12, eyy, 3, 3, blink ? BODY2 : '#f4f8fa');
  if(!blink){ pxRect(cx-11, eyy, 2, 2, NOSE); pxPix(cx-11, eyy, '#ffffff'); }
  pxRect(cx-2, eyy, 3, 3, blink ? BODY2 : '#f4f8fa');
  if(!blink){ pxRect(cx-1, eyy, 2, 2, NOSE); pxPix(cx-1, eyy, '#ffffff'); }
  /* ---- 底部与船板收口（防止露出底图旧狗残影）---- */
  pxRect(D.x, y + 3, D.w, 4, '#5c4028');
  pxRect(D.x, y + 3, D.w, 1, '#7a5636');
  c.globalAlpha = 0.5;
  pxRect(D.x, y + 6, D.w, 3, '#3d2a1a');
  c.globalAlpha = 1;
}
function pxEmitSplash(cx, cy, power){
  const budget = PX.bg ? 0.4 : 1;
  const n = Math.round(power * budget);
  let made = 0;
  for(let i=0;i<PX.P.length && made<n;i++){
    const p = PX.P[i];
    if(p.alive) continue;
    const a = -Math.PI/2 + (Math.random()-0.5) * Math.PI * 1.25;
    const sp = 0.9 + Math.random()*2.6;
    p.alive = true; p.x = cx + (Math.random()-0.5)*7; p.y = cy;
    p.vx = Math.cos(a)*sp; p.vy = Math.sin(a)*sp - 1.1;
    p.life = 0; p.max = 18 + Math.round(Math.random()*16);
    p.col = Math.random()<0.55 ? '#ffffff' : (Math.random()<0.5 ? '#dceefb' : '#bcdcf0');
    p.sz = Math.random()<0.42 ? 2 : 1;
    made++;
  }
}

/** 图像模式·场景调度：按 6 分镜驱动竿/线/漂/鱼/水花 */
function pxDrawSceneImg(){
  const s = PX.scene, sk = pxSkin();
  const sy = PX.L.surfY, bobX = PX.L.bobX;
  const f = PX.fade.a;

  /* ---- 竿角度与弯垂（分镜驱动的核心变量） ---- */
  /* 基准 213°：从手部 (492,247) 指向左上，竿身从狗头上方掠过（不压狗脸） */
  let ang = 213, pull = 0, thick = 2;
  if(s.state==='cast'){
    const T = s.t;
    if(T < 9)        ang = 204 + T*1.1;            // 后摆蓄力
    else if(T < 17)  ang = 214 - (T-9)*1.6;        // 前甩
    else             ang = 213;                    // 持竿待机
    if(T >= 9 && T < 17) pull = 6;                 // 甩出瞬间竿梢弯垂
  } else if(s.state==='waiting'){
    /* 待机也要有持续的“活着感”：竿身缓慢起伏 + 浮漂上下浮动 + 线随手微摆 */
    const wob = Math.sin(PX.frame * 0.052);
    ang = 213 + wob * 4.2;                            // 竿身明显起伏
    pull = 2.4 + Math.sin(PX.frame*0.09) * 2.6;       // 竿梢持续轻颤
  } else if(s.state==='bite'){
    ang = s.fishSize==='big' ? 194 : (s.fishSize==='mid' ? 202 : 207);
    pull = s.fishSize==='big' ? (30 + Math.sin(s.t*0.9)*6)
         : s.fishSize==='mid' ? (14 + Math.min(10,s.t*0.7)*0.6) : 7;
  } else if(s.state==='reel'){
    const big = s.fishSize==='big', dur = big ? 46 : 26, k = Math.min(1, s.t/dur);
    ang = 213 - k*12; pull = big ? (1-k)*30 : (1-k)*14;
  } else if(s.state==='caught'){ ang = 206; pull = 8; }
  else if(s.state==='lost'){
    ang = s.result==='break' ? 198 : 204;
    pull = s.result==='break' ? 26 : 4;
  }
  // 咬钩拉锯时竿身高频抖动（最直观的“在较劲”信号）
  if(s.state==='bite'){
    const amp2 = s.fishSize==='big' ? 5.5 : (s.fishSize==='mid' ? 3.2 : 1.8);
    ang  += Math.sin(PX.frame*0.62) * amp2;
    pull += Math.sin(PX.frame*0.85) * amp2 * 0.8;
  }
  // 底图整体起伏时竿基同步
  ang += PX.bgTilt * 0.6;
  const rod = pxDrawImgRod(ang, pull, thick);

  /* ================= 1. 抛钩 ================= */
  if(s.state==='cast'){
    const T = s.t;
    if(T < 17){
      // 后摆→前甩：竿梢划过空气的柔和水痕
      if(T >= 7){
        const tr = (T-7)*1.6;
        PX.ctx.globalAlpha = Math.max(0.05, 0.4 - tr*0.06);
        for(let i=0;i<9;i++){
          const k = i/8;
          pxPix(Math.round(rod.ex + 16 - k*34 - tr*2), Math.round(rod.ey + 10 - k*18), '#dceaf5');
        }
        PX.ctx.globalAlpha = 1;
      }
    } else {
      // 饵飞行：高抛物线（参考图的大 C 形轨迹），带拖尾
      const k = Math.min(1, (T-17)/28);
      const tgtX = bobX, tgtY = sy - 8;
      const px0 = rod.ex + 10 + (tgtX - rod.ex - 10) * k;
      const py0 = rod.ey - Math.sin(k*Math.PI)*118 + (tgtY - rod.ey)*k;
      // 拖尾（按速度衰减的残影点）
      for(let i=1;i<=7;i++){
        const kk = Math.max(0, k - i*0.028);
        const tx = rod.ex + 10 + (tgtX - rod.ex - 10) * kk;
        const ty = rod.ey - Math.sin(kk*Math.PI)*118 + (tgtY - rod.ey)*kk;
        PX.ctx.globalAlpha = 0.34 * (1 - i/8);
        pxRect(Math.round(tx), Math.round(ty), 2, 2, '#dff0fa');
        PX.ctx.globalAlpha = 1;
      }
      pxDrawImgLine(rod.ex, rod.ey, px0, py0, 0, 1);
      // 饵（亮黄小球 + 小钩）
      pxRect(Math.round(px0)-3, Math.round(py0)-3, 7, 7, '#f2c53a');
      pxRect(Math.round(px0)-2, Math.round(py0)-2, 4, 4, '#ffe89a');
      pxRect(Math.round(px0), Math.round(py0)+4, 2, 4, '#b9c4cc');
      pxPix(Math.round(px0)-1, Math.round(py0)+7, '#e8f2f8');
      // 落水
      if(k >= 1){
        const rr = (T-45)*2.6;
        if(rr > 0 && rr < 96){
          PX.ctx.globalAlpha = Math.max(0.05, 0.7 - rr/96);
          for(let i=0;i<28;i++){
            const a2 = i/28*Math.PI*2;
            pxPix(Math.round(bobX + Math.cos(a2)*rr*1.8),
                  Math.round(sy + Math.sin(a2)*rr*0.34), '#d6ecfa');
          }
          PX.ctx.globalAlpha = 1;
        }
        if(T % 5 === 0 && T < 70) pxEmitSplash(bobX, sy, 6);
        if(T > 74) pxToIdle();
      }
    }
  }

  /* ================= 2. 等待咬钩 ================= */
  else if(s.state==='waiting'){
    const drift = Math.sin(PX.frame*0.085) * 4.5;         // 浮漂明显左右漂移
    const vfloat = sy - 7 + Math.sin(PX.frame*0.105) * 3.2; // 且上下浮动
    const bY = vfloat + drift*0.25;
    // 线：竿梢 → 浮漂，垂度随竿身起伏变化（线在水面轻轻拖拽）
    pxDrawImgLine(rod.ex, rod.ey, bobX + drift*0.6, bY - 2, 3 + Math.sin(PX.frame*0.07)*3, 1);
    // 浮漂下方水里的鱼影巡游
    for(let i=0;i<3;i++){
      const per = 300 + i*90;
      const kk = (PX.frame + i*110) % per;
      const prog = kk < per/2 ? kk/(per/2) : 1-(kk-per/2)/(per/2);
      // 鱼影只在左侧空旷水域巡游（船体区 x>=360 不进，避免穿过人物）
      const fx = 70 + prog*250;
      const fy = Math.min(310, sy - 12 + i*10 + Math.sin(PX.frame*0.04 + i)*3);
      pxDrawImgFish(fx, fy, '#5b7d92', kk<per/2 ? 0 : 180, 0.8, {alpha:0.30});
    }
    pxDrawImgBobber(bobX + drift, bY);
    // 同心涟漪环（持续扩散，跟随浮漂位置；速度调快保证任何时刻都在变）
    pxDrawImgRings(bobX + drift, sy + 4, 150, 5, 0.44, 1.85);
    // 水面环境小波纹（不依赖场景动作，保证画面始终在动）
    if(!PX.bg){
      for(let i=0;i<16;i++){
        const y = sy + 2 + ((i*3.1) % 28);
        const w = 12 + ((i*29) % 26);
        const x = ((i*71 + PX.frame*2.4) % (PX.W + w)) - w;
        PX.ctx.globalAlpha = 0.16 - (i%3)*0.03;
        pxRect(x, Math.round(y), w, 1, '#e4f3fd');
        PX.ctx.globalAlpha = 1;
      }
    }
    // 轻微咬口预兆
    if(Math.random() < 0.014 && !s.phase){ s.phase = 'nibble'; s.nibbleT = 0; }
    if(s.phase==='nibble'){
      s.nibbleT = (s.nibbleT||0) + 1;
      const n = s.nibbleT;
      const dy = (n%6 < 3) ? 7 : -6;                     // 抖动幅度加大
      pxDrawImgBobber(bobX + drift, bY + dy);
      if(n % 4 === 0) pxEmitSplash(bobX + drift, sy + 2, 4);
      if(n > 22) s.phase = '';
    }
  }

  /* ================= 3. 咬钩 ================= */
  else if(s.state==='bite'){
    const T = s.t, col = pxRarityColor(s.fishRarity);
    const small = s.fishSize==='small', mid = s.fishSize==='mid';
    const sink = small ? Math.min(12, T*1.5)
               : mid   ? Math.min(26, T*2.0)
               : Math.min(52, T*3.0);
    const bY = sy - 7 + sink;
    const sway = Math.round(Math.sin(T*0.62) * (small?5:mid?14:26));   // 拉扯幅度加大
    // 线被绷紧：垂度随拉力减小（咬钩时线是拉直的）
    pxDrawImgLine(rod.ex, rod.ey, bobX + sway, bY - 2, small?8:1, small?1:2);
    pxDrawImgBobber(bobX + sway, bY);
    pxDrawImgRings(bobX + sway, sy + 3, 165, 4, 0.42, 2.1);
    // 水花：咬钩越猛越大
    if(T % 4 === 0) pxEmitSplash(bobX + sway, sy + 2, small?5:(mid?12:20));
    // 鱼咬在浮漂正下方：头朝上对准线端，持续挣扎摆动（线-漂-鱼三点连续）
    const fishY = Math.min(304, bY + 16 + sink*0.4);
    const fishA = -84 + Math.sin(T*0.85)*16;                 // 头朝上左右甩头
    const fishScale = small ? 0.75 : (mid ? 1.0 : 1.45);
    pxDrawImgFish(bobX + sway*0.85, fishY, col, fishA, fishScale, {alpha:0.82, look: pxFishLook(s.fishName||'', s.fishRarity)});
    // 鱼嘴到浮漂的短线（咬钩连接段）
    pxDrawImgLine(bobX + sway, bY + 4, bobX + sway*0.85, fishY - (small?18:26), 0, 1);
    // 巨物：水下更大剪影 + 泄力器光点
    if(!small && !mid){
      pxDrawImgFish(bobX + sway - 14, Math.min(308, fishY + 26), col, fishA + 8, 1.6, {alpha:0.42});
      for(let i=0;i<6;i++){
        const ph = (PX.frame + i*3) % 14;
        if(ph < 7) pxPix(PX.L.rodHandX - 8 - i*5, PX.L.rodHandY + 2 + (i%2), '#ffd27a');
      }
      if(T === 2) pxShake();
    }
  }

  /* ================= 4. 上鱼 ================= */
  else if(s.state==='reel'){
    const T = s.t, big = s.fishSize==='big';
    const dur = big ? 52 : 30;
    const k = Math.min(1, T/dur);
    const ease = k*k*(3-2*k);                    // smoothstep 缓动：无匀速生硬感
    const col = pxRarityColor(s.fishRarity);
    /* 鱼始终咬在「线端」：线的末端=鱼嘴，全程连续不跳变。
       轨迹：从浮漂处沿水面拖行 → 平滑抬头 → 被提到半空 */
    const mouthX = bobX + ease*(330 - bobX);                    // 拖向船头前水域
    const lift  = Math.max(0, ease - 0.45) / 0.55;              // 后 55% 才离水
    const mouthY = sy - 2 - lift*lift*54;                       // 二次缓动升空
    const fishLen = big ? 110*1.5 : 64*1.25;
    // 挂着时略微倾斜（-72°），让鱼身轮廓、尾鳍、背鳍都能看清，不再是竖直色块
    const ang = -72 + lift*18 + Math.sin(T*0.75)*10;            // 头朝上挣扎摆动
    // 线：竿梢 → 鱼嘴（直接锚定，无垂度抖动跳变）
    pxDrawImgLine(rod.ex, rod.ey, mouthX, mouthY - fishLen*0.40, 2, big?2:1);
    const reelLook = pxFishLook(s.fishName||'', s.fishRarity);
    pxDrawImgFish(mouthX, mouthY, col, ang, big?1.5:1.25, {big:big, look:reelLook});
    // 水面拖行痕迹（仅入水阶段）
    if(lift < 0.25){
      for(let i=0;i<12;i++){
        const kx = i/11, wx = mouthX + 10 + kx*60;
        PX.ctx.globalAlpha = 0.38*(1-kx*0.75);
        pxRect(Math.round(wx), Math.round(sy + 1 + kx*6), 2, 1, '#e6f4fc');
        pxRect(Math.round(mouthX - 12 - kx*46), Math.round(sy + 1 + kx*6), 2, 1, '#e6f4fc');
        PX.ctx.globalAlpha = 1;
      }
    }
    pxDrawImgRings(mouthX, sy + 4, 120, 3, 0.32, 1.3);
    if(T % 3 === 0 && lift < 0.7) pxEmitSplash(mouthX - 4, sy + 2, big?14:7);
    if(T > dur){ if(big) pxShake(); pxSetScene('caught', {rarity:s.fishRarity, size:s.fishSize}); }
  }

  /* ================= 5. 脱钩（鱼跳出水面甩钩 + 空钩荡回） ================= */
  else if(s.state==='lost'){
    const T = s.t, col = pxRarityColor(s.fishRarity);
    const look = pxFishLook(s.fishName||'', s.fishRarity);   // 跑掉的就是咬钩那条，长得一样
    if(s.result === 'break'){
      // 切线：抖动的线 → 断点 → 断线垂落 + 鱼影逃逸
      const snapT = 12, bx = bobX + 34;
      if(T < snapT){
        const jit = Math.sin(T*1.1)*15;
        pxDrawImgLine(rod.ex, rod.ey, bx + jit, sy + 22, 4, 2);
        pxDrawImgFish(bx - 34, Math.min(308, sy + 16 + T*0.8), col, 200, 1.2, {alpha:0.8, look});
      } else {
        // 竿端垂下的断线
        pxDrawImgLine(rod.ex, rod.ey, rod.ex + 40, rod.ey + 46, 12, 1);
        // 逃逸的鱼（向右下潜）
        const k2 = Math.min(1, (T-snapT)/30);
        pxDrawImgFish(bx + k2*130, Math.min(308, sy + 26 + k2*30), col, 168 + k2*14, 1.3, {alpha:0.85, look});
        if(T===snapT){ pxEmitSplash(bx, sy+2, 10); pxShake(); }
      }
    } else {
      // 脱钩：鱼跃出水面做抛物线（参考图5），随后空钩荡回、浮漂弹起
      const jumpT = 34;
      if(T < jumpT){
        const k = T/jumpT;
        const jx = bobX - 10 + k*118;
        const jy = sy - 6 - Math.sin(k*Math.PI)*86;   // 抛物线跃出
        pxDrawImgLine(rod.ex, rod.ey, jx, jy + 10, 6, 1);
        pxDrawImgFish(jx, jy, col, -70 + k*150, 1.15, {look});  // 空中翻转甩钩
        PX.ctx.globalAlpha = 0.5;
        for(let i=0;i<12;i++){
          const sr = i*7 + (T*3 % 7);
          pxPix(Math.round(jx - 6 + Math.cos(i*0.5)*sr), Math.round(jy + 10 + Math.sin(i*0.5)*sr*0.4), '#eaf6ff');
        }
        PX.ctx.globalAlpha = 1;
        if(T % 4 === 0) pxEmitSplash(jx, sy + 2, 6);
        if(T === 2) pxShake();
      } else {
        // 鱼没入水中，空钩在空中荡回（J 形弧）
        const backT = T - jumpT;
        const drift = Math.sin(backT*0.30) * 30 * Math.max(0, 1 - backT/26);
        const hx = bobX + 96 + drift, hy = sy - 34 + Math.sin(backT*0.5)*8;
        pxDrawImgLine(rod.ex, rod.ey, hx, hy, 10, 1);
        // 空钩（J 形，亮银色，参考图5中部悬浮的钩）
        pxRect(Math.round(hx), Math.round(hy), 2, 7, '#dbe6ee');
        pxRect(Math.round(hx)-2, Math.round(hy)+7, 6, 2, '#dbe6ee');
        pxRect(Math.round(hx)+3, Math.round(hy)+4, 2, 5, '#dbe6ee');
        pxPix(Math.round(hx), Math.round(hy)-1, '#ffffff');
        // 鱼下潜逃逸
        if(backT < 40) pxDrawImgFish(bobX - 108 - backT*1.4, Math.min(308, sy + 16 + backT*2.2), col, 172, 1.2, {alpha:0.8, look});
      }
      // 浮漂弹回原位的余波
      const bb = Math.max(0, 1 - T/26);
      pxDrawImgBobber(bobX, sy - 6 - Math.sin(Math.min(T,26)*0.5)*7*bb);
      pxDrawImgRings(bobX, sy + 4, 120, 3, 0.26*bb + 0.05, 1.0);
    }
    if(T > 58) pxToIdle();
  }

  /* ================= 6. 钓到大鱼（巨物半身出水） ================= */
  else if(s.state==='caught'){
    const T = s.t, big = s.fishSize==='big';
    const col = pxRarityColor(s.fishRarity);
    if(big){
      // 巨物：半身冲出水面、水幕倾泻、珠光闪烁（对齐参考图6）
      const rise = Math.min(1, T/16);
      // 鱼身中心逐渐抬升，但保持下半身在水面以下（半浸没）
      const cy = sy + 8 - rise * 34;
      const cx = bobX + 100;
      // 水幕：鱼身与水面交界处的白色浪花带（集中在鱼体两侧）
      PX.ctx.globalAlpha = 0.66;
      for(let i=0;i<26;i++){
        const kx = i/25;
        const wx = cx - 78 + kx*150;
        const wy = sy + 2 + Math.sin(kx*Math.PI)*7 + Math.sin(PX.frame*0.5 + i)*2.5;
        pxRect(Math.round(wx), Math.round(wy), 2, 4 + (i%4)*4, '#eaf6ff');
      }
      PX.ctx.globalAlpha = 1;
      pxDrawImgFish(cx, cy, col, -30, 1.55, {big:true, pearl:true, look: pxFishLook(s.fishName||'', s.fishRarity)});
      // 大量飞溅
      if(T % 2 === 0 && T < 40) pxEmitSplash(cx - 60 + Math.random()*120, sy + 2, 20);
      pxDrawImgRings(cx, sy + 8, 150, 4, 0.36, 1.7);
      if(T === 2) pxShake();
    } else {
      // 普通钓获：鱼被提在船侧，轻微摆动
      const cy = sy - 22, cx = bobX + 70;
      pxDrawImgFish(cx, cy, col, -46 + Math.sin(T*0.2)*8, 1.1, {look: pxFishLook(s.fishName||'', s.fishRarity)});
      pxDrawImgLine(rod.ex, rod.ey, cx + 16, cy - 6, 6, 1);
      if(T % 5 < 3) pxEmitSplash(cx, sy + 2, 5);
      pxDrawImgRings(cx, sy + 4, 100, 3, 0.24, 1.0);
    }
    if(T > 44) pxToIdle();
  }

  /* ================= 全域事件（保持可用） ================= */
  else if(s.state==='tide'){
    for(let i=0;i<8;i++){
      const a = 0.06 + Math.sin(PX.frame*0.2 + i)*0.03;
      PX.ctx.fillStyle = 'rgba(74,168,255,'+a.toFixed(2)+')';
      PX.ctx.fillRect(0, i*3, PX.W, 2);
      PX.ctx.fillRect(0, PX.H-2-i*3, PX.W, 2);
    }
    // 鱼潮：鱼群只在浮漂左侧水面巡游（避开船体区 x>=360）
    for(let i=0;i<14;i++){
      const fx = ((PX.frame*4.2 + i*57) % 380) - 40;
      const fy = sy + 22 + (i%4)*20 + Math.sin((PX.frame+i*8)*0.3)*4;
      pxDrawImgFish(fx, fy, PAL.rare[(i%2)?'rare':'good'], 0, 0.85, {alpha:0.85});
    }
    const dy = Math.sin(PX.frame*1.0)*3;
    pxDrawImgLine(rod.ex, rod.ey, bobX, sy-6+dy, 4, 1);
    pxDrawImgBobber(bobX, sy - 6 + dy);
    pxDrawImgRings(bobX, sy + 4, 140, 4, 0.30, 1.6);
  } else if(s.state==='nest'){
    // 万窝聚鱼：窝点涟漪 + 鱼群环绕
    PX.ctx.fillStyle = 'rgba(255,193,94,0.05)'; PX.ctx.fillRect(0, sy, PX.W, PX.H-sy);
    pxDrawImgRings(bobX, sy + 4, 160, 5, 0.30, 1.9);
    for(let i=0;i<18;i++){
      const orb = (PX.frame*0.6 + i*13) % 96;
      const ang = (i/18)*Math.PI*2 + PX.frame*0.05;
      const rr = 18 + (orb/96)*84;
      // 环绕半径收窄（x 倍率 1.8→1.25），并夹在左侧水域，避免游到船与人身上
      const nx = Math.max(30, Math.min(352, bobX + Math.cos(ang)*rr*1.25));
      pxDrawImgFish(nx, sy + 20 + Math.sin(ang)*rr*0.30,
                    PAL.rare[(i%2)?'legend':'good'], Math.cos(ang)<0?0:180, 0.85, {alpha:0.85});
    }
    pxDrawImgBobber(bobX, sy - 6 + Math.sin(PX.frame*0.3));
    pxDrawImgLine(rod.ex, rod.ey, bobX, sy - 8, 4, 1);
    if(PX.frame % 4 === 0) pxEmitSplash(bobX, sy + 4, 4);
  }
  // 切场淡入淡出遮罩
  if(f < 1){
    PX.ctx.globalAlpha = 1 - f;
    pxRect(0, 0, PX.W, PX.H, '#060c14');
    PX.ctx.globalAlpha = 1;
  }
}


/** 水下常驻鱼影（等待/抛钩期缓慢巡游；宽幅下散布整个水下区域） */
function pxDrawUnderFish(){
  const s = PX.scene;
  const wl = PX.L.waterY, H = PX.H;
  const band = H - wl;                          // 水下纵深
  if(PX.bg && t3(PX.frame)) return;
  if(s.state==='waiting' || s.state==='cast'){
    for(let i=0;i<7;i++){
      const period = 240 + i*53;
      const k = (PX.frame + i*60) % period;
      const prog = k < period/2 ? k/(period/2) : 1-(k-period/2)/(period/2);
      const fx = Math.round(80 + prog*(PX.W-160));
      const fy = Math.round(wl + band*0.18 + i*band*0.11);
      pxFishBody(fx, fy, '#5b7280', k<period/2?0:1, i===6?'big':'');
    }
  } else if(s.state==='tide'){
    for(let i=0;i<22;i++){
      const sp = 3.6 + (i%3)*0.8;
      const fx = Math.round(((PX.frame*sp + i*37) % (PX.W+80)) - 40);
      const fy = Math.round(wl + band*0.10 + (i%4)*band*0.16 + Math.round(Math.sin((PX.frame+i*8)*0.3)*4));
      pxFishBody(fx, fy, PAL.rare[(i%2)?'rare':'good'], 0, i%5===0?'big':'');
    }
  } else if(s.state==='nest'){
    const cx = PX.L.bobX, cy = wl + band*0.42;
    for(let i=0;i<16;i++){
      const orb = (PX.frame*0.5 + i*11) % 72;
      const ang = (i/16)*Math.PI*2 + PX.frame*0.05;
      const rr = 16 + (orb/72)*70;
      const fx = Math.round(cx + Math.cos(ang)*rr*1.6);
      const fy = Math.round(cy + Math.sin(ang)*rr*0.45);
      pxFishBody(fx, fy, PAL.rare[(i%2)?'legend':'good'], Math.cos(ang)<0?1:0, '');
    }
  }
}
function t3(f){ return f % 3 !== 0; }

/** 钓获高光弹窗：传说 / 神隐鱼在画面内弹出彩色像素鱼图标短暂闪烁 */
function pxPopupCatch(r, fish){
  if(!PX.on) return;
  const o = RARITY[r] ? RARITY[r].order : 0;
  if(o < 2) return;                              // 稀有及以上才弹（普通/精良靠起鱼动画展示）
  PX.popup.r = r;
  PX.popup.fish = fish || null;                  // 带上鱼 → 弹窗里画这条鱼本来的样子
  PX.popup.t = 0;
  PX.popup.life = o >= 4 ? 40 : (o === 3 ? 30 : 22);   // 品级越高停留越久（≈0.9s~1.6s）
}
/** 绘制钓获高光弹窗：品质边框横幅 + 这条鱼本来的样子（不再是色块） */
function pxPopupDraw(){
  const p = PX.popup;
  if(!p.r || p.life <= 0) return;
  p.t++; p.life--;
  const a = Math.min(1, p.life / 10);            // 尾段淡出
  if(p.life <= 0){ p.r = null; p.fish = null; return; }
  const cx = PX.W/2, cy = 78;
  const order = RARITY[p.r] ? RARITY[p.r].order : 0;
  const blink = order >= 4 && (Math.floor(p.t/4) % 2 !== 0);   // 仅传说/神隐闪烁
  if(blink) return;
  const col = pxRarityColor(p.r);
  const look = p.fish ? pxFishLook(p.fish.name, p.r) : null;
  const c = PX.ctx;
  // 横幅底：深色底板 + 品质色描边（替换原来的大面积纯色块）
  const bw = 150, bh = 54;
  c.globalAlpha = a * 0.80;
  pxRect(cx - bw/2, cy - bh/2, bw, bh, '#0e2233');
  c.globalAlpha = a;
  pxRect(cx - bw/2, cy - bh/2, bw, 2, col);
  pxRect(cx - bw/2, cy + bh/2 - 2, bw, 2, col);
  pxRect(cx - bw/2, cy - bh/2, 2, bh, col);
  pxRect(cx + bw/2 - 2, cy - bh/2, 2, bh, col);
  // 这条鱼本来的样子：体形/配色/花纹按鱼种生成
  pxDrawImgFish(cx - 24, cy, col, 0, 1.05, {look});
  // 四角外发光
  const glow = p.r === 'mystic' ? '#ffffff' : '#ffc340';
  pxRect(cx-66, cy-35, 6, 6, glow); pxRect(cx+60, cy-35, 6, 6, glow);
  pxRect(cx-66, cy+29, 6, 6, glow); pxRect(cx+60, cy+29, 6, 6, glow);
  c.globalAlpha = 1;
}

/** 场景调度：计算姿态 → 画船 → 画竿/线/漂 → 场景细节 */
function pxDrawScene(){
  const s = PX.scene, sk = pxSkin();
  const wl = PX.L.waterY, bobX = PX.L.bobX;
  const f = PX.fade.a;
  // 先算船体姿态并存起来供 pxDrawRod 使用
  const pose = pxBoatPose();
  PX._pose = pose;
  // 基准角度 208°：画布坐标 y 向下，208° = cos<0 / sin<0 → 指向左上方（参考图姿态）
  PX._rodAngle = 208; PX._rodPull = 0;

  // 场景对竿角/拉力的影响（在画船前定好，保证竿与船同步）
  if(s.state==='cast'){
    const T = s.t;
    // 后摆蓄力（竿梢扬向身后上方）→ 前甩（扫向左前方）→ 回到持竿姿态
    if(T < 10) PX._rodAngle = 234 + T*1.2;
    else if(T < 18) PX._rodAngle = 246 - (T-10)*8;
    else PX._rodAngle = 208;
  } else if(s.state==='bite'){
    PX._rodAngle = s.fishSize==='big' ? 194 : (s.fishSize==='mid' ? 202 : 205);
    PX._rodPull  = s.fishSize==='big' ? (14 + Math.sin(s.t*0.8)*4)
                 : s.fishSize==='mid' ? (3 + (Math.min(9,s.t*0.6)/9)*6) : 2;
  } else if(s.state==='reel'){
    const big = s.fishSize==='big';
    const dur = big ? 46 : 26, k = Math.min(1, s.t/dur);
    PX._rodAngle = 208 - k*8;               // 收线时竿略压低
    PX._rodPull  = big ? (1-k)*14 : (1-k)*6;
  } else if(s.state==='caught'){ PX._rodAngle = 200; }
  else if(s.state==='lost'){ PX._rodAngle = s.result==='break' ? 196 : 198; PX._rodPull = s.result==='break' ? 0 : 4; }

  // 画船（含钓手）+ 竿（不受淡出）
  const pose2 = pxDrawBoat();
  if(f > 0.35) pxDrawRod();

  // 竿梢 / 手部坐标
  const ex = PX._rodEx || 0, ey = PX._rodEy || 0;

  // ---------- 分场景细节（宽幅 720×320 坐标） ----------
  if(s.state==='cast'){
    const T = s.t;
    const handX = PX._handX, handY = PX._handY;
    const len = 112 * PX.boatScale, a = PX._rodAngle*Math.PI/180;
    const rx = Math.round(handX + Math.cos(a)*len), ry = Math.round(handY + Math.sin(a)*len);
    if(T < 18){
      // 后摆蓄力阶段：竿梢划过空气的柔和水痕
      if(T>=10 && T<18) pxEmit(rx+14, ry+10, 5, Math.PI*1.4, '#bcd8e8');
    } else {
      // 前甩 → 饵飞向浮漂位置（高抛物线，参考图饵线呈大 C 形）
      const k = Math.min(1, (T-18)/26);
      const px_ = Math.round(rx + 18 + k*(bobX - rx - 18));
      const py_ = Math.round(ry - Math.sin(k*Math.PI)*104 + k*(wl - ry + 34));
      pxDrawLine(rx, ry, px_, py_, 0);
      // 飞行的饵（带拖尾）
      pxRect(px_, py_, 3, 3, '#c8d6df');
      pxRect(px_-2, py_-3, 2, 2, '#9fb4c0');
      pxRect(px_-1, py_+4, 4, 3, '#7a5a3a');
      pxPix(px_+1, py_+8, '#c9d6dd');
      // 落水柔和涟漪（宽画面充分向外扩散，不被边框截断）
      if(k >= 1){
        const rr = (T-44)*2.2;
        if(rr > 0 && rr < 96){
          const cc = PX.ctx;
          for(let i=0;i<26;i++){
            const ang = i/26*Math.PI*2;
            cc.globalAlpha = Math.max(0.05, 0.7 - rr/96);
            pxPix(Math.round(bobX + Math.cos(ang)*rr*1.7), Math.round(wl + Math.sin(ang)*rr*0.5), '#cfe8f5');
          }
          cc.globalAlpha = 1;
        }
        if(T % 6 === 0 && T < 64) pxEmit(bobX, wl, 4, Math.PI*0.8, '#cfe8f5');
        if(T > 66){ pxToIdle(); }
      }
    }
  } else if(s.state==='waiting'){
    const drift = Math.sin(PX.frame*0.09) * 1.6;
    pxDrawLine(PX._rodEx, PX._rodEy, bobX+2, wl+drift-3, 5);
    pxDrawBobber(bobX, wl, drift, PAL.bobber);
    // 待机同心涟漪环：周期性扩散 3 圈（参考图水面有持续的圆形涟漪）
    if(!PX.bg){
      const cyc = (PX.frame * 0.9) % 108;
      for(let i=0;i<3;i++){
        const rr = cyc - i*36;
        if(rr <= 0 || rr > 96) continue;
        const a = Math.max(0.04, 0.42 * (1 - rr/96));
        PX.ctx.globalAlpha = a;
        for(let g=0; g<24; g++){
          const ang = g/24*Math.PI*2;
          pxPix(Math.round(bobX + Math.cos(ang)*rr*1.8),
                Math.round(wl + Math.sin(ang)*rr*0.46), '#cfe8f5');
        }
        PX.ctx.globalAlpha = 1;
      }
    }
    // 轻微咬口：浮漂小幅轻抖
    if(Math.random() < 0.02 && !s.phase){ s.phase = 'nibble'; s.nibbleT = 0; }
    if(s.phase==='nibble'){
      s.nibbleT = (s.nibbleT||0) + 1;
      const n = s.nibbleT;
      const dy = (n%6 < 3) ? 4 : -3;
      pxDrawBobber(bobX, wl, dy, PAL.bobber);
      if(n % 5 === 0) pxEmit(bobX, wl+2, 3, Math.PI*0.7, '#cfe8f5');
      pxFishBody(bobX-40+n*4, wl+34, '#5b7280', 0, '');
      if(n > 20) s.phase = '';
    }
  } else if(s.state==='bite'){
    const T = s.t, col = pxRarityColor(s.fishRarity);
    const small = s.fishSize==='small', mid = s.fishSize==='mid';
    if(small){
      // 小鱼：浮漂轻点，小幅拉扯，小船轻微晃动
      const dy = T<8 ? ((T%4<2)?3:0) : (T<16 ? 6 : 9);
      pxDrawBobber(bobX, wl, dy, PAL.bobber);
      pxDrawLine(PX._rodEx, PX._rodEy, bobX+2, wl+dy-2, 3);
      if(T%8<3) pxEmit(bobX, wl+4, 3, Math.PI*0.8, '#cfe8f5');
      pxFishBody(bobX-48, wl+52, col, 1, '');
    } else if(mid){
      // 稀有/史诗：浮漂半沉，中等拉扯，船明显摇摆
      const dy = T<10 ? ((T%3<2)?4:0) : (T<22 ? 13 : 20);
      pxDrawBobber(bobX, wl, dy, PAL.bobber);
      const sway = Math.round(Math.sin(T*0.5)*9);
      pxDrawLine(PX._rodEx, PX._rodEy, bobX+2+sway, wl+dy-2, 4);
      if(T%6<3) pxEmit(bobX+sway, wl+5, 6, Math.PI*0.9, '#cfe8f5');
      pxRipples(wl+2, 4, 2, 1.4, pxMix(sk.waterTop, '#ffffff', 0.3));
      pxFishBody(bobX-54+sway, wl+60, col, 1, '');
    } else {
      // 神隐巨物：浮漂被拽入水下，大面积柔和水花，船体大幅侧摆
      const dy = Math.min(52, T*3);
      pxEmit(bobX, wl+8, 16, Math.PI*1.15, '#bcd8e8');
      pxEmit(bobX-34, wl+14, 11, Math.PI*0.9, '#a8c8dc');
      pxEmit(bobX+34, wl+14, 11, Math.PI*0.9, '#a8c8dc');
      pxEmit(bobX, wl+30, 8, Math.PI*1.3, '#8fb8d4');
      pxRipples(wl+2, 6, 2, 2.0, pxMix(sk.waterTop, '#ffffff', 0.4));
      const sway = Math.round(Math.sin(T*0.7)*18);
      pxDrawLine(PX._rodEx, PX._rodEy, bobX+2+sway, wl+dy, 8);
      // 巨物剪影（宽画面完整呈现，不裁切）
      PX.ctx.globalAlpha = 0.75;
      pxRect(bobX-76, wl+40, 58, 26, col);
      pxRect(bobX-93, wl+47, 19, 11, col);
      pxRect(bobX-76, wl+33, 22, 9, col);
      pxRect(bobX+26, wl+44, 14, 16, col);
      PX.ctx.globalAlpha = 1;
      pxPix(bobX-30, wl+48, '#0d2130');
      // 泄力器柔和光点（无强闪）
      for(let i=0;i<5;i++){
        const ph = (PX.frame + i*3) % 14;
        if(ph < 7) pxPix(PX._handX - 6 - i*4, PX._handY + 4 + (i%2), '#e8b45a');
      }
      if(T===2) pxShake();
    }
  } else if(s.state==='reel'){
    const T = s.t, big = s.fishSize==='big';
    const dur = big ? 46 : 26, k = Math.min(1, T/dur);
    const col = pxRarityColor(s.fishRarity);
    // 从浮漂位置拉向船侧
    const fx = Math.round(bobX - k*(bobX - PX.L.boatX - 90));
    const fy = Math.round(wl + 58 - k*(58 + (big?22:6)));
    pxDrawLine(PX._rodEx, PX._rodEy, fx, fy, 2-k*2);
    if(big){
      PX.ctx.globalAlpha = 0.9;
      pxRect(fx-26, fy-10, 52, 22, col);
      pxRect(fx-40, fy-3, 14, 8, col);
      pxPix(fx+16, fy-3, '#0d2130');
      PX.ctx.globalAlpha = 1;
    } else {
      pxFishBody(fx, fy, col, 0, 'big');
    }
    if(T % 5 === 0) pxEmit(fx+4, wl+10, big?10:5, Math.PI*0.9, '#cfe8f5');
    if(big) pxRipples(wl+2, 5, 2, 1.8, pxMix(sk.waterTop, '#ffffff', 0.35));
    if(T > dur){
      if(big) pxShake();
      pxSetScene('caught', {rarity:s.fishRarity, size:s.fishSize});
    }
  } else if(s.state==='caught'){
    const T = s.t, col = pxRarityColor(s.fishRarity);
    const blink = (Math.floor(T/4) % 2) === 0;
    const cx = PX.L.boatX + 90, cy = wl + 30;
    if(blink){
      PX.ctx.globalAlpha = 0.95;
      pxRect(cx-26, cy-10, 52, 22, col);
      pxRect(cx-40, cy-3, 14, 8, col);
      pxRect(cx-26, cy-16, 19, 7, col);
      PX.ctx.globalAlpha = 1;
      pxPix(cx+16, cy-3, '#0d2130');
      pxPix(cx-34, cy-19, '#ffffff'); pxPix(cx+30, cy-19, '#ffffff');
      pxPix(cx-34, cy+14, '#ffffff');  pxPix(cx+30, cy+14, '#ffffff');
    }
    if(T % 5 < 3) pxEmit(cx, cy+6, 5, Math.PI*0.8, '#cfe8f5');
    if(T > 16) pxToIdle();      // ≈0.7s @24fps
  } else if(s.state==='lost'){
    const T = s.t, col = pxRarityColor(s.fishRarity);
    if(s.result === 'break'){
      // 切线
      const snapT = 12;
      const bx = bobX + 40;
      if(T < snapT){
        const sway = Math.sin(T*0.9)*14;
        pxDrawLine(PX._rodEx, PX._rodEy, bx+sway, wl+38, 7);
        PX.ctx.globalAlpha = 0.85;
        pxRect(bx-40, wl+32, 40, 20, col);
        PX.ctx.globalAlpha = 1;
      } else {
        pxDrawLine(PX._handX, PX._handY, PX._handX+46, PX._handY+22, 2);
        const gx = bobX + 76, gy = wl + 20 + (T-snapT)*1.8;
        pxDrawLine(bx-6, wl+28, gx, Math.min(gy, PX.H-8), 0);
        pxRect(gx-1, Math.min(gy,PX.H-8), 2, 2, '#b8c6cf');
        const k2 = Math.min(1,(T-snapT)/26);
        PX.ctx.globalAlpha = 0.8;
        pxRect(bx + k2*110, wl+44 + k2*26, 40, 16, col);
        PX.ctx.globalAlpha = 1;
        if(T===snapT) pxEmit(bx-6, wl+28, 9, Math.PI*0.9, '#cfe8f5');
      }
    } else {
      // 洗鳃脱钩：鱼冲出水面甩头 → 扭头游向深水 → 浮漂弹回
      const backT = Math.max(0, T-14);
      const bobDy = -Math.min(9, backT*1.2);
      pxDrawBobber(bobX, wl, bobDy, PAL.bobber);
      const fx = bobX - 52 - backT*3.6, fy = wl + 10 + backT*4;
      if(backT < 28){
        PX.ctx.globalAlpha = 0.85;
        pxRect(fx, fy, 44, 18, col);
        pxRect(fx-16, fy+3, 14, 8, col);
        PX.ctx.globalAlpha = 1;
      }
      if(T < 18){
        pxEmit(bobX-48, wl+4, 11, Math.PI*1.0, '#cfe8f5');
        pxDrawLine(PX._rodEx, PX._rodEy, bobX-40, wl+14, 4);
      }
      if(T===3) pxShake();
    }
    if(T > 46) pxToIdle();
  } else if(s.state==='tide'){
    // 边缘淡蓝光晕（柔和）
    for(let i=0;i<7;i++){
      const a = 0.05 + Math.sin(PX.frame*0.2 + i)*0.025;
      PX.ctx.fillStyle = 'rgba(74,168,255,'+a.toFixed(2)+')';
      PX.ctx.fillRect(0, i*3, PX.W, 2);
      PX.ctx.fillRect(0, PX.H-2-i*3, PX.W, 2);
    }
    pxRipples(wl+2, 6, 2, 2.4, pxMix(sk.waterTop, '#ffffff', 0.35));
    const dy = Math.sin(PX.frame*1.1)*3;
    pxDrawBobber(bobX, wl, dy, PAL.bobber);
    pxDrawLine(PX._rodEx, PX._rodEy, bobX+2, wl+dy-3, 3);
  } else if(s.state==='nest'){
    // 万窝聚鱼：窝点涟漪铺满水面，鱼群环绕窝点盘旋
    const nestX = PX.L.bobX;
    PX.ctx.fillStyle = 'rgba(255,193,94,0.045)'; PX.ctx.fillRect(0, wl, PX.W, PX.H-wl);
    for(let i=0;i<4;i++){
      const r = ((PX.frame*2.0 + i*24) % 140);
      for(let a=0;a<30;a++){
        const ang = a/30*Math.PI*2;
        PX.ctx.globalAlpha = Math.max(0.08, 0.7 - r/140);
        pxPix(Math.round(nestX + Math.cos(ang)*r*1.7), Math.round(wl + Math.sin(ang)*r*0.42), '#ffe9b0');
      }
      PX.ctx.globalAlpha = 1;
    }
    pxDrawBobber(bobX, wl, Math.sin(PX.frame*0.3), PAL.bobber);
    pxDrawLine(PX._rodEx, PX._rodEy, bobX+2, wl-3, 4);
    // 窝料褐色沉淀粒子
    if(PX.frame % 4 === 0) pxEmit(nestX, wl+8, 3, Math.PI*0.5, '#a8825a');
    for(let i=0;i<9;i++){
      if((PX.frame + i*4) % 18 < 9) pxPix(nestX - 140 + i*36, wl+30 + (i%3)*16, '#e8c88a');
    }
  }
}

/** 动作播完回到待机：若有全域事件则优先呈现 */
function pxToIdle(){
  const now = Date.now();
  if((ENV.frenzyUntil||0) > now || PX.nestUntil > now){ pxSetScene('nest'); return; }
  if((ENV.tideUntil||0) > now || PX.tideUntil > now){ pxSetScene('tide'); return; }
  pxSetScene('waiting');
}

/* ---- 与游戏事件联动 ---- */
/** 打窝 → 抛钩 */
function pxEventCast(){
  if(!PX.on) return;
  pxSetScene('cast');
}
/** 上钩 → 咬钩（按品级分档） */
function pxEventBite(rarity, fishName){
  if(!PX.on) return;
  const o = RARITY[rarity].order;
  const size = o<=1 ? 'small' : (o<=3 ? 'mid' : 'big');
  pxSetScene('bite', {rarity, size, name: fishName});
  const biteFrames = size==='big' ? 22 : (size==='mid' ? 20 : 16);
  const ms = biteFrames * (1000/PX.fps);
  if(PX.glideTimer) clearTimeout(PX.glideTimer);
  PX.glideTimer = setTimeout(()=>{
    if(!PX.on) return;
    if(PX.scene.state !== 'bite') return;
    pxSetScene('reel', {rarity, size});
  }, ms);
}
/** 跑鱼 → 洗鳃脱钩 / 切线 */
function pxEventLost(rarity, kind){
  if(!PX.on) return;
  const o = RARITY[rarity].order;
  const size = o<=1 ? 'small' : (o<=3 ? 'mid' : 'big');
  pxSetScene('lost', {rarity, size, result: kind||'shake'});
}
/** 空钩（轻抖） */
function pxEventNibble(){
  if(!PX.on) return;
  if(PX.scene.state !== 'waiting') return;
  PX.scene.phase = 'nibble';
  PX.scene.nibbleT = 0;
}
function pxCheckEnv(){
  if(!PX.on) return;
  const now = Date.now();
  const cur = PX.scene.state;
  // 抛钩/咬钩/起鱼/跑鱼为「动作场景」，播放期间不被环境状态打断
  if(['cast','bite','reel','caught','lost'].indexOf(cur) >= 0) return;
  const frenzy = (ENV.frenzyUntil||0) > now;
  const tide = (ENV.tideUntil||0) > now;
  // 万窝聚鱼优先于鱼潮（两者同时在时以高价值事件呈现）
  if(frenzy || PX.nestUntil > now){ if(cur!=='nest') pxSetScene('nest'); return; }
  if(tide){ if(cur!=='tide') pxSetScene('tide'); return; }
  if(cur==='tide' || cur==='nest') pxSetScene('waiting');
}

/* =========================================================================
   6 种渔场专属船型（船心为原点，向上为负 y）
   ========================================================================= */
/** 通用：舷侧高光 + 船底阴影 */
function pxHullShade(x,y,w,h,p,dark){
  pxRect(x, y+h-2, w, 2, dark || '#0a1218');
  pxRect(x, y, w, 1, p.deck);
}
/** 船体入水阴影：水面被船体压出的暗色凹陷 + 两侧受光反光（参考图船底有明显暗带） */
function pxBoatShadow(w){
  const c = PX.ctx;
  c.globalAlpha = 0.42;
  pxRect(-w/2, 5, w, 4, '#050c12');
  c.globalAlpha = 0.22;
  pxRect(-w/2 - 6, 6, w + 12, 2, '#050c12');    // 向外扩散的水面凹陷
  c.globalAlpha = 0.24;
  pxRect(-w/2 + 4, 9, w - 8, 1, '#cfe8f5');     // 船底外沿的细反光
  c.globalAlpha = 1;
}

/* 1) 新手池塘｜小木船：平底短身，暖木色，船头微翘，舷侧木纹 + 内舱掏空 */
function pxBoatSkiff(p){
  pxBoatShadow(64);
  // 船体（梯形近似：用多条矩形拼出木船纵剖面）
  pxRect(-30, -8, 60, 12, p.hull);
  pxRect(-34, -4, 68, 7, p.hull2);
  pxRect(-26, -10, 52, 4, p.deck);
  pxHullShade(-30, -8, 60, 12, p);
  // 舷侧木纹（参考图木船有清晰横向板缝）

/* ---------------- 主循环 ---------------- */
function renderAll(){
  if(!S) return;
  renderResBar(); renderBanners(); renderActionBar();
  renderTabHeads(); renderPaneL(); renderPaneR();
  // 启停（仅在游戏会话中生效，登出后不会意外重启）
  if(S.auto && !autoTimer && !document.getElementById('authScreen').classList.contains('on')) startAuto();
  renderAnimHud();
}
let uiTimer=null;
function startUI(){
  if(uiTimer) clearInterval(uiTimer);
  uiTimer = setInterval(()=>{
    renderResBar(); renderBanners();
    // 像素动画：环境状态检查（鱼潮 / 万窝 / 满仓角标）
    pxCheckEnv(); pxSyncWindowCls();
    // 轻量刷新当前面板（窝点倒计时需要）
    if(tabR==='pond') renderPaneR();
    if(tabL==='bait') renderPaneL();
    renderAnimHud();
    // 窝点过期提示
    const n = S.nest;
    if(n.baitId && Date.now()>=n.endAt){
      pushLog('⏳ 窝点效果已结束，记得重新打窝','log-sys');
      S.nest = {baitId:null,endAt:0,startAt:0,target:null,tier:0,castAt:0};
      renderResBar();
    }
  }, 1000);
}
function startNpc(){
  if(npcTimer) clearInterval(npcTimer);
  npcTimer = setInterval(()=>{ tickNpcs(); if(tabR==='rank'||tabR==='social') renderPaneR(); }, 3000);
}
function startAutoSave(){
  if(autoSaveTimer) clearInterval(autoSaveTimer);
  autoSaveTimer = setInterval(()=>{ save(); checkWelfare(); }, 12000);
}
/** 统一停止所有定时器（登出 / 切换账号） */
function stopAllTimers(){
  stopAuto();
  if(kickTimer){ clearTimeout(kickTimer); kickTimer=null; }
  if(uiTimer){ clearInterval(uiTimer); uiTimer=null; }
  if(npcTimer){ clearInterval(npcTimer); npcTimer=null; }
  if(autoSaveTimer){ clearInterval(autoSaveTimer); autoSaveTimer=null; }
  if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; }
  if(PX.glideTimer){ clearTimeout(PX.glideTimer); PX.glideTimer=null; }
  pxStop();
  PX.scene.phase = '';
}

/* ---------------- 登录（云服务：手机号验证码 / 微信） ---------------- */
let pendingOtp = null;        // {phone, verificationId, isExistingUser}
let codeCountdown = 0, codeTimer = null;

function showAuth(){
  stopAllTimers();
  document.getElementById('gameRoot').classList.remove('on');
  document.getElementById('authScreen').classList.add('on');
  document.body.style.overflow = 'auto';
  setTimeout(()=>{ try{ document.getElementById('authPhone').focus(); }catch(e){} }, 120);
}
function hideAuth(){
  document.getElementById('authScreen').classList.remove('on');
  document.getElementById('gameRoot').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function authErr(msg){
  const el = document.getElementById('authErr');
  el.textContent = msg; el.classList.add('on');
}
function phoneErr(msg){
  const el = document.getElementById('phoneErr');
  if(el) el.textContent = msg || '';
}
function onPhoneInput(){
  phoneErr('');
  document.getElementById('authErr').classList.remove('on');
}
/** 获取验证码：仅负责发送，验证在 submitAuth 单独进行 */
async function sendPhoneCode(){
  const btn = document.getElementById('btnSendCode');
  const phone = (document.getElementById('authPhone').value || '').trim();
  if(!/^1\d{10}$/.test(phone)){ phoneErr('请输入正确的 11 位手机号'); return; }
  phoneErr('');
  document.getElementById('authErr').classList.remove('on');
  if(codeTimer) return;
  btn.disabled = true;
  try{
    const sent = await cloud.auth.sendOtp({ phone });
    if(sent.error){ authErr(sent.error.message || '验证码发送失败，请稍后重试'); btn.disabled = false; return; }
    pendingOtp = { phone, verificationId: sent.data.verificationId, isExistingUser: sent.data.isExistingUser };
    toast('验证码已发送','good');
    codeCountdown = 60;
    btn.textContent = codeCountdown + ' 秒后重发';
    codeTimer = setInterval(()=>{
      codeCountdown--;
      if(codeCountdown <= 0){
        clearInterval(codeTimer); codeTimer = null;
        btn.disabled = false; btn.textContent = '获取验证码';
      }else{
        btn.textContent = codeCountdown + ' 秒后重发';
      }
    }, 1000);
  }catch(e){
    authErr('验证码发送失败，请检查网络后重试');
    btn.disabled = false;
  }
}
/** 提交验证码登录/注册（新手机号首次登录自动建号） */
async function submitAuth(){
  const btn = document.getElementById('authSubmit');
  const phone = (document.getElementById('authPhone').value || '').trim();
  const code = (document.getElementById('authCode').value || '').trim();
  document.getElementById('authErr').classList.remove('on');
  if(!/^1\d{10}$/.test(phone)){ phoneErr('请输入正确的 11 位手机号'); return; }
  phoneErr('');
  if(!code) return authErr('请输入验证码');
  if(!pendingOtp || pendingOtp.phone !== phone) return authErr('请先获取验证码');

  btn.disabled = true;
  const oldTxt = btn.textContent;
  btn.textContent = '登录中…';
  try{
    const r = await cloud.auth.verifyOtp({
      phone: pendingOtp.phone,
      verificationId: pendingOtp.verificationId,
      isExistingUser: pendingOtp.isExistingUser,
      token: code,
    });
    if(r.error){ authErr(r.error.message || '验证码错误，请重试'); return; }
    pendingOtp = null;
    if(codeTimer){ clearInterval(codeTimer); codeTimer = null; }
    const sb = document.getElementById('btnSendCode');
    if(sb){ sb.disabled = false; sb.textContent = '获取验证码'; }
    await afterLogin(uidOf(r.data));
  }catch(e){
    authErr('登录失败，请稍后重试');
  }finally{
    btn.disabled = false;
    btn.textContent = oldTxt;
  }
}
/** 微信登录（网站授权）：拿到跳转地址后导航，回调在 boot 里处理 */
async function wechatLogin(){
  try{
    const { data, error } = await cloud.auth.signInWithOAuth({
      provider: 'wechat',
      redirectTo: location.origin,      // 必须落到站点根路径
    });
    if(error){ authErr(error.message || '微信登录启动失败'); return; }
    if(data && data.url) location.assign(data.url);
  }catch(e){
    authErr('微信登录启动失败，请稍后重试');
  }
}
/** 从会话对象里取用户 ID */
function uidOf(session){
  if(session && session.user && session.user.id) return session.user.id;
  if(session && session.id) return session.id;
  return null;
}

/** 登录成功后：装载云端存档 → 进入游戏 */
async function afterLogin(uid){
  if(!uid){
    try{
      const g = await cloud.auth.getUser();
      uid = g && g.data && g.data.id;
    }catch(e){}
  }
  ME = { uid: uid || '' };
  let row = null;
  try{
    row = await cloudLoadRow();
  }catch(e){
    toast('⚠️ 云端存档读取失败，将创建新存档','bad');
  }
  S = hydrate(row ? row.data : null);
  S.uid = ME.uid;
  if(!S.name || !String(S.name).trim()) S.name = '无名钓手';
  hideAuth();
  startSession();
}
/** 开启一局游戏会话（可重复调用，切换账号时也走这里） */
function startSession(){
  initNpcs();
  logs = [];
  pushLog('🎣 欢迎回来，<b class="t-legend">'+esc(S.name||'无名钓手')+'</b>！自动挂机已就绪','log-big');
  offlineSettle();
  CAST_T0 = Date.now();
  renderAll();
  startAuto(); startUI(); startNpc(); startAutoSave();
  // 初始化 Hi-Bit 像素动画（渔场皮肤跟随当前渔场）
  PX.on = S.pxAnim !== false;
  const pw = document.getElementById('pixelWin');
  if(pw) pw.classList.toggle('off', !PX.on);
  const txt = PX.on ? '🎞️' : '🚫';
  const pb = document.getElementById('btnPixel');
  if(pb){ pb.textContent = txt; pb.classList.toggle('on', PX.on); }
  const hb = document.getElementById('btnPixelHero');
  if(hb){ hb.textContent = txt; hb.classList.toggle('on', PX.on); hb.title = PX.on ? '动画开启中 · 点击关闭' : '动画已关闭 · 点击开启'; }
  pxApplySpot(S.spot);
  PX.fade.a = 1; PX.fade.dir = 0; PX.fade.pending = null;
  pxFitHero();
  if(PX.on){ pxSetScene('waiting'); pxStart(); }
  pxSyncPaused();
  renderAnimHud();
}

window.doRename = async function(){

  S.name = v;
  closeModal(); renderAll(); flushSave();
  toast('已改名为 '+v,'gold');
};
async function logout(){
  flushSave();
  try{ await cloud.auth.signOut(); }catch(e){}

/* ---------------- 启动 ---------------- */
let shellBound = false;
function bindShell(){
  if(shellBound) return;
  shellBound = true;
  window.addEventListener('beforeunload', ()=>{ if(S) flushSave(); });
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ if(S) flushSave(); }
    else if(S){ save(); }
  });
  document.getElementById('scrim').onclick = closeDrawers;
  document.getElementById('mask').onclick = (e)=>{ if(e.target.id==='mask') closeModal(); };
  document.getElementById('btnMenuL').onclick = ()=>openDrawer('colL');
  document.getElementById('btnMenuR').onclick = ()=>openDrawer('colR');
  document.getElementById('btnNest').onclick = openNest;
  document.getElementById('btnAccount').onclick = openAccount;
  document.getElementById('btnMute').onclick = (e)=>{ S.mute=!S.mute; e.currentTarget.textContent = S.mute?'🔇':'🔊'; toast(S.mute?'已关闭播报':'已开启播报','good'); save(); };
  document.getElementById('btnPixel').onclick = ()=>{ pxToggle(); toast(PX.on?'🎞️ 像素动画已开启':'🚫 已关闭动画，仅保留文字挂机', PX.on?'good':'bad'); };
  // 窗口右上角开关（与 header 按钮共享状态）
  const heroBtn = document.getElementById('btnPixelHero');
  if(heroBtn) heroBtn.onclick = ()=>{ pxToggle(); toast(PX.on?'🎞️ 动画已开启':'🚫 动画已关闭，仅渲染静态场景', PX.on?'good':'bad'); };
  document.addEventListener('visibilitychange', pxOnVisibility);
  // 宽幅视窗尺寸：按容器可用空间等比计算，resize 时重算
  pxFitHero();
  window.addEventListener('resize', ()=>{ pxFitHero(); });
  if(window.ResizeObserver){
    const h = document.getElementById('animHero');
    if(h) new ResizeObserver(()=>pxFitHero()).observe(h);
  }
  // 表单回车提交
  ['authPhone','authCode'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('keydown', ev=>{ if(ev.key==='Enter') submitAuth(); });
  });
}
let booted = false;
/** 启动：先处理微信回调（必须早于任何登录守卫），再判断会话 */
async function boot(){
  if(booted) return;
  booted = true;
  bindShell();

  if(!window.WorkBuddyCloud){
    showAuth();
    authErr('云服务组件加载失败，请检查网络后刷新页面');
    return;
  }
  cloud = window.WorkBuddyCloud.createWorkBuddyCloud({
    endpoint: CLOUD_CFG.endpoint,
    oauthRelayBaseUrl: CLOUD_CFG.oauthRelayBaseUrl,
    publishableKey: CLOUD_CFG.publishableKey,
  });
  cloud.auth.onAuthStateChange((event)=>{
    if(event === 'SIGNED_OUT'){
      ME = null; S = null;
      stopAllTimers();
      showAuth();
    }
  });

  // 1) 微信登录回调：URL 带 code 时兑换会话；普通访问返回空数据，属正常分支
  try{
    const cb = await cloud.auth.handleWechatWebCallback();
    const sess = cb && cb.data ? (cb.data.session || cb.data) : null;
    if(sess && !cb.error){
      history.replaceState(null, '', location.pathname);   // 清掉 code/state，防止刷新重放
      await afterLogin(uidOf(sess));
      return;
    }
  }catch(e){ /* 回调异常时按普通访问继续 */ }

  // 2) 会话守卫：有会话直接进游戏，否则展示登录页
  await enterApp();
}
/** 服务可用后的入场：已有会话直接进游戏，否则展示登录页 */
async function enterApp(){
  const warn = document.getElementById('offlineWarn');
  if(warn){ warn.className = 'warnBar'; warn.textContent = ''; }
  try{
    const { data: session, error } = await cloud.auth.getSession();
    if(error || !session){ showAuth(); return; }
    await afterLogin(uidOf(session));
  }catch(e){
    showAuth();
    authErr('连接云端账号服务失败，请检查网络后重试');
  }
}
window.addEventListener('DOMContentLoaded', boot);
if(document.readyState!=='loading') boot();
