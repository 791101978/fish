<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1a2a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎣</text></svg>">
<title>放松垂钓 · 文字挂机钓鱼</title>
<style>
:root{
  --bg:#0a1520; --bg2:#0e1f2e; --panel:#12293c; --panel2:#173148;
  --line:#1f425c; --line2:#2a5a7a;
  --txt:#d8ecf7; --txt2:#8fb4cc; --txt3:#5f8098;
  --common:#9fb6c4; --good:#5fd08a; --rare:#4aa8ff; --epic:#b06bff; --legend:#ffc340; --mystic:#ff6ec7;
  --gold:#ffcb52; --red:#ff5f6d; --green:#39d98a;
  --shadow:0 8px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:radial-gradient(1200px 700px at 15% -10%,#163b57 0%,transparent 55%),
             radial-gradient(900px 600px at 110% 10%,#123c4a 0%,transparent 50%),
             var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px; line-height:1.55; overflow:hidden;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 布局 ---------- */
#app{height:100%;display:flex;flex-direction:column;max-width:1400px;margin:0 auto}
header{
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:linear-gradient(180deg,rgba(18,41,60,.95),rgba(14,31,46,.85));
  border-bottom:1px solid var(--line);backdrop-filter:blur(8px);z-index:30;
  flex-wrap:wrap;
}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:.5px;white-space:nowrap}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.res{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.resItem{
  display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);
  padding:3px 9px;border-radius:20px;font-size:12.5px;white-space:nowrap
}
.resItem b{color:var(--gold);font-variant-numeric:tabular-nums;font-weight:700}
.resItem .ico{font-size:13px}

.main{flex:1;display:flex;min-height:0;overflow:hidden}
.col{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.col-left{width:290px;border-right:1px solid var(--line);background:rgba(10,21,32,.5)}
.col-mid{flex:1;min-width:0}
.col-right{width:320px;border-left:1px solid var(--line);background:rgba(10,21,32,.5)}
@media(max-width:1080px){
  .col-left,.col-right{position:fixed;top:0;bottom:0;z-index:60;width:300px;background:var(--bg2);
    transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow)}
  .col-left{left:0;transform:translateX(-102%)}
  .col-right{right:0;transform:translateX(102%)}
  .col-left.open,.col-right.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;opacity:0;pointer-events:none;transition:opacity .28s}
  .scrim.on{opacity:1;pointer-events:auto}
  header{padding:6px 8px}
  .res{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .res::-webkit-scrollbar{display:none}
  .resItem{flex-shrink:0}
  #toasts{top:auto!important;bottom:96px}
}
@media(min-width:1081px){.scrim{display:none}.only-mobile{display:none!important}}
.only-mobile{display:none}
@media(max-width:1080px){.only-mobile{display:inline-flex}}

.sec{padding:9px 11px;border-bottom:1px solid var(--line)}
.sec-title{font-size:11px;color:var(--txt3);letter-spacing:1.5px;font-weight:700;margin-bottom:7px;text-transform:uppercase}
.scroll{overflow-y:auto;overflow-x:hidden;flex:1;min-height:0}

/* ---------- 渔场 ---------- */
.scene{
  position:relative;flex:1;min-height:0;overflow:hidden;
  background:linear-gradient(180deg,#0d2b40 0%,#0a1e2e 45%,#07131d 100%);
}
.scene::before{
  content:"";position:absolute;inset:0;opacity:.16;
  background:repeating-linear-gradient(0deg,transparent 0 22px,rgba(90,180,230,.18) 22px 23px);
  animation:drift 14s linear infinite;
}
@keyframes drift{to{transform:translateY(23px)}}
.skyglow{position:absolute;left:50%;top:-140px;width:520px;height:320px;transform:translateX(-50%);
  background:radial-gradient(ellipse,rgba(90,200,255,.22),transparent 68%);pointer-events:none}
.scene-inner{position:relative;height:100%;display:flex;flex-direction:column;padding:10px 12px;gap:9px;min-height:0}

.bannerRow{display:flex;gap:8px;flex-wrap:wrap}
.banner{
  display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:10px;font-size:12.5px;font-weight:600;
  border:1px solid var(--line2);background:rgba(23,49,72,.75)
}
.banner.tide{background:linear-gradient(90deg,rgba(255,110,199,.22),rgba(74,168,255,.18));border-color:var(--mystic);animation:glow 1.6s infinite}
.banner.nest{background:linear-gradient(90deg,rgba(95,208,138,.2),rgba(74,168,255,.14));border-color:var(--good)}
.banner.sat{background:linear-gradient(90deg,rgba(255,203,82,.2),rgba(255,110,199,.14));border-color:var(--gold)}
@keyframes glow{0%,100%{box-shadow:0 0 0 rgba(255,110,199,0)}50%{box-shadow:0 0 18px rgba(255,110,199,.5)}}

/* ---------- 主动画视窗（宽幅横版主视觉，铺满中栏上半部） ----------
   比例 720/320 由 JS 统一按容器可用空间等比计算（pxFitHero），
   避免纯 CSS 下 width/height 单轴夹取导致的比例拉伸。 */
.animHero{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center;padding:2px 0;overflow:hidden}
.pixelWin{
  position:relative;width:100%;aspect-ratio:720/320;
  border:2px solid var(--line2);border-radius:8px;overflow:hidden;
  background:#0a1a26;image-rendering:pixelated;image-rendering:-moz-crisp-edges;
  box-shadow:inset 0 0 40px rgba(0,0,0,.7), 0 0 0 1px rgba(90,180,230,.12);
}
.pixelWin canvas{
  display:block;width:100%;height:100%;
  image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;
}
.pixelWin.frenzy{box-shadow:inset 0 0 44px rgba(255,110,199,.45),0 0 22px rgba(255,110,199,.5)}
.pixelWin.tide{box-shadow:inset 0 0 44px rgba(74,168,255,.45),0 0 22px rgba(74,168,255,.5)}
.pixelWin.shake{animation:pxshake .34s linear}
@keyframes pxshake{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-3px,1px)}
  40%{transform:translate(3px,-1px)}
  60%{transform:translate(-2px,-2px)}
  80%{transform:translate(2px,2px)}
}
.pixelOff{
  position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:rgba(7,19,29,.9);color:var(--txt3);font-size:13px;font-weight:600;
  letter-spacing:1px;text-align:center;padding:10px
}
.pixelOff span{font-size:11px;font-weight:500;opacity:.75}
.pixelWin.off .pixelOff{display:flex}
/* 满仓红色闪烁提示 */
.basketWarn{
  position:absolute;top:8px;left:8px;display:none;
  font-size:10.5px;font-weight:800;line-height:1;padding:4px 7px;border-radius:5px;
  background:#7a1c22;color:#ffd6d9;border:1px solid #ff5f6d;
}
.pixelWin.full .basketWarn{display:block;animation:warnblink .85s steps(1,end) infinite}
@keyframes warnblink{0%,49%{opacity:1}50%,100%{opacity:.18}}
/* 右下角极简状态小字（不抢画面，不挡交互） */
.animHud{
  position:absolute;right:10px;bottom:8px;pointer-events:none;
  display:flex;align-items:center;gap:6px;max-width:70%;
  font-size:11px;font-weight:600;line-height:1.2;
  color:rgba(226,240,250,.92);letter-spacing:.3px;
  padding:3px 9px;border-radius:999px;
  background:rgba(6,16,24,.55);border:1px solid rgba(120,180,220,.16);
  text-shadow:0 1px 2px rgba(0,0,0,.85);
  backdrop-filter:blur(3px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.animHud .nest{color:var(--gold);font-variant-numeric:tabular-nums}
.animHud .sep{opacity:.35}
/* 右上角动画开关（关闭后仅渲染静态场景图，适合上班摸鱼） */
.animToggle{
  position:absolute;right:8px;top:8px;z-index:3;
  width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;
  font-size:15px;line-height:1;cursor:pointer;
  background:rgba(6,16,24,.6);color:var(--txt2);
  border:1px solid rgba(120,180,220,.22);border-radius:8px;
  backdrop-filter:blur(3px);transition:background .18s,color .18s,border-color .18s;
}
.animToggle:hover{background:rgba(20,44,64,.85);color:#dff0fb;border-color:rgba(120,180,220,.42)}
.animToggle.on{color:var(--gold);border-color:rgba(255,195,64,.4)}
@media(max-width:560px){
  .animToggle{width:26px;height:26px;font-size:13px;right:6px;top:6px}
  .animHud{font-size:10px;padding:2px 7px;right:7px;bottom:6px;max-width:78%}
  .basketWarn{font-size:9.5px;top:6px;left:6px}
}
/* 日志（中栏下半部：日志聊天面板） */
.logBox{flex:1;min-height:150px;overflow-y:auto;background:rgba(7,19,29,.62);border:1px solid var(--line);
  border-radius:12px;padding:8px 10px;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.logLine{animation:slideIn .35s ease-out;line-height:1.5;word-break:break-word}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.logLine .nm{font-weight:700}
.logLine .tm{color:var(--txt3);font-size:11px;margin-right:5px}
.log-sys{color:var(--txt2)}
.log-big{background:rgba(255,203,82,.1);border-left:2px solid var(--gold);padding:2px 7px;border-radius:0 6px 6px 0}
.log-rare{background:rgba(74,168,255,.1);border-left:2px solid var(--rare);padding:2px 7px;border-radius:0 6px 6px 0}
.log-epic{background:rgba(176,107,255,.12);border-left:2px solid var(--epic);padding:2px 7px;border-radius:0 6px 6px 0}
.log-legend{background:rgba(255,195,64,.14);border-left:2px solid var(--legend);padding:2px 7px;border-radius:0 6px 6px 0}
.log-mystic{background:linear-gradient(90deg,rgba(255,110,199,.18),rgba(255,195,64,.1));border-left:2px solid var(--mystic);padding:2px 7px;border-radius:0 6px 6px 0}
.log-chat{color:#9fd9f2}
.log-tip{color:var(--good)}

/* 底部动作条 */
.actionBar{display:flex;gap:7px;flex-wrap:wrap}
.btn{
  padding:7px 13px;border-radius:9px;font-size:12.5px;font-weight:600;
  background:var(--panel2);border:1px solid var(--line2);transition:.15s;
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap
}
.btn:hover{background:#1e4059;border-color:#3b7799;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(135deg,#1f7fd4,#1a5fa8);border-color:#3b9be0;color:#fff}
.btn.primary:hover{background:linear-gradient(135deg,#2590ea,#2070c0)}
.btn.gold{background:linear-gradient(135deg,#d19b1f,#a87413);border-color:#ffcb52;color:#fff5d6}
.btn.gold:hover{background:linear-gradient(135deg,#e8ad26,#bd8517)}
.btn.pink{background:linear-gradient(135deg,#c0419a,#8d2f74);border-color:#ff6ec7;color:#ffe6f7}
.btn.sm{padding:4px 9px;font-size:11.5px;border-radius:7px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.5);transform:none!important}
.btn.on{background:linear-gradient(135deg,#1a7a4d,#14603c);border-color:var(--good)}

/* ---------- 卡片/通用 ---------- */
.tabs{display:flex;gap:4px;padding:7px 9px;border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0}
.tab{padding:5px 11px;border-radius:8px;font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--txt2)}
.tab.on{background:var(--panel2);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-bottom:8px}
.card.hl{border-color:var(--line2);background:linear-gradient(160deg,var(--panel2),var(--panel))}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row+.row{margin-top:5px}
.muted{color:var(--txt2);font-size:12px}
.tiny{font-size:11px;color:var(--txt3)}
.bar{height:5px;background:#0a1a26;border-radius:5px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:5px;transition:width .3s}

.pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid}
.p-common{color:var(--common);border-color:var(--common);background:rgba(159,182,196,.1)}
.p-good{color:var(--good);border-color:var(--good);background:rgba(95,208,138,.1)}
.p-rare{color:var(--rare);border-color:var(--rare);background:rgba(74,168,255,.12)}
.p-epic{color:var(--epic);border-color:var(--epic);background:rgba(176,107,255,.12)}
.p-legend{color:var(--legend);border-color:var(--legend);background:rgba(255,195,64,.12)}
.p-mystic{color:var(--mystic);border-color:var(--mystic);background:linear-gradient(90deg,rgba(255,110,199,.16),rgba(255,195,64,.1))}
.t-common{color:var(--common)} .t-good{color:var(--good)} .t-rare{color:var(--rare)}
.t-epic{color:var(--epic)} .t-legend{color:var(--legend)} .t-mystic{color:var(--mystic)}

/* 装备 */
.eqGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.eqSlot{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 8px;
  cursor:pointer;transition:.15s;position:relative;overflow:hidden
}
.eqSlot:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.eqSlot .slotName{font-size:11px;color:var(--txt3);font-weight:600}
.eqSlot .eqName{font-size:12.5px;font-weight:700;margin-top:2px}
.eqSlot .eqLv{font-size:10.5px;color:var(--txt2);margin-top:3px}
.slotEmpty{opacity:.5}

/* 鱼篓 */
.fishItem{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;border-radius:8px;
  background:rgba(23,49,72,.6);margin-bottom:4px;border-left:3px solid var(--line2);font-size:12px}
.fishItem .qty{color:var(--txt2);font-size:11.5px}

/* 榜单 */
.rankItem{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:8px;font-size:12px;margin-bottom:3px}
.rankItem.me{background:rgba(255,203,82,.12);box-shadow:inset 0 0 0 1px rgba(255,203,82,.35)}
.rankItem .no{width:19px;text-align:center;font-weight:800;color:var(--txt3);flex-shrink:0}
.rankItem .no.top1{color:#ffd54a} .rankItem .no.top2{color:#cfd8e0} .rankItem .no.top3{color:#e0954e}
.rankItem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rankItem .val{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(4,12,19,.78);z-index:100;display:none;
  align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.mask.on{display:flex}
.modal{background:linear-gradient(170deg,var(--panel2),#0e2131);border:1px solid var(--line2);
  border-radius:16px;max-width:460px;width:100%;max-height:84vh;overflow-y:auto;box-shadow:var(--shadow);
  animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(23,49,72,.97);z-index:2;border-radius:16px 16px 0 0}
.modal-h h3{margin:0;font-size:15px}
.modal-b{padding:13px 15px}
.modal-f{padding:11px 15px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.close{font-size:19px;color:var(--txt3);line-height:1;padding:2px 6px;border-radius:6px}
.close:hover{background:rgba(255,255,255,.08);color:var(--txt)}

/* toast */
#toasts{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{padding:7px 15px;border-radius:20px;font-size:12.5px;font-weight:600;background:rgba(23,49,72,.96);
  border:1px solid var(--line2);box-shadow:var(--shadow);animation:tin .3s ease-out;max-width:88vw;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.toast.good{border-color:var(--good);color:#b8f5d0}
.toast.bad{border-color:var(--red);color:#ffc4c9}
.toast.gold{border-color:var(--gold);color:#ffe9b0}
.toast.mystic{border-color:var(--mystic);color:#ffd6f2}

.hint{font-size:11.5px;color:var(--txt3);line-height:1.55}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:2.5px 0}
.kv span:first-child{color:var(--txt2)}
.kv b{font-variant-numeric:tabular-nums}
.grec{font-size:11px;color:var(--good)}

/* ---------- 登录 / 注册 ---------- */
#authScreen{
  position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:18px;
  background:radial-gradient(1000px 640px at 20% -10%,#17415e 0%,transparent 58%),
             radial-gradient(800px 560px at 105% 12%,#12404d 0%,transparent 52%),
             linear-gradient(170deg,#0a1622,#060e16);
  overflow-y:auto;
}
#authScreen.on{display:flex}
#gameRoot{display:none}
#gameRoot.on{display:block;height:100%}
.authBox{width:100%;max-width:392px;margin:auto}
.authBrand{text-align:center;margin-bottom:20px}
.authBrand .bt{font-size:26px;font-weight:800;letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:8px}
.authBrand .bt .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold);animation:pulse 1.8s infinite}
.authBrand .bs{font-size:12px;color:var(--txt3);margin-top:7px;letter-spacing:.6px}
.authCard{background:linear-gradient(168deg,rgba(23,49,72,.9),rgba(14,32,46,.94));border:1px solid var(--line2);
  border-radius:18px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.authTabs{display:flex;background:#0a1a26;border-radius:11px;padding:3px;margin-bottom:15px;border:1px solid var(--line)}
.authTab{flex:1;text-align:center;padding:8px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--txt3);transition:.18s}
.authTab.on{background:linear-gradient(135deg,#1f7fd4,#1a5fa8);color:#fff;box-shadow:0 3px 12px rgba(31,127,212,.35)}
.field{margin-bottom:11px}
.field label{display:block;font-size:11.5px;color:var(--txt2);margin-bottom:5px;font-weight:600}
.field input{
  width:100%;padding:11px 13px;border-radius:10px;background:#0a1a26;color:var(--txt);
  border:1px solid var(--line);font-size:14px;font-family:inherit;outline:none;transition:.18s
}
.field input:focus{border-color:#3b9be0;box-shadow:0 0 0 3px rgba(59,155,224,.14)}
.field input::placeholder{color:#46637a}
.authBtn{
  width:100%;padding:12px;border-radius:11px;font-size:14.5px;font-weight:700;margin-top:5px;
  background:linear-gradient(135deg,#1f7fd4,#1a5fa8);color:#fff;border:1px solid #3b9be0;transition:.16s
}
.authBtn:hover{background:linear-gradient(135deg,#2590ea,#2070c0);transform:translateY(-1px)}
.authBtn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.authErr{
  font-size:12px;color:#ffb3b9;background:rgba(255,95,109,.1);border:1px solid rgba(255,95,109,.35);
  border-radius:9px;padding:7px 11px;margin-bottom:11px;display:none
}
.authErr.on{display:block;animation:slideIn .25s}
.authNote{font-size:11px;color:var(--txt3);text-align:center;margin-top:13px;line-height:1.6}

/** 读取当前账号的存档行（RLS 只返回本人那一行） */
async function cloudLoadRow(){

    .from('saves').select('id, data, updated_at').limit(1).maybeSingle();
  if(error) throw error;
  return data || null;

/** 上传存档：有行则更新，无行则插入（含并发冲突兜底） */
async function pushSave(){
  if(!S || !ME || !cloud) return;
  if(pushing){ pushQueued = true; return; }
  pushing = true;
  try{
    const str = JSON.stringify(S);
    if(str.length > MAX_SAVE_BYTES){
      if(!pushFailed){ pushFailed = true; toast('⚠️ 存档体积超出上限，本次未能同步到云端','bad'); }
      return;
    }
    const row = await cloudLoadRow();
    if(row){
      const { data, error } = await cloud.database.from('saves')
        .update({ data: S, owner_name: (S.name || '').trim() || null, updated_at: new Date().toISOString() })
        .eq('id', row.id).select();
      if(error) throw error;
      if(!Array.isArray(data) || !data.length) throw new Error('存档更新未生效');
    }else{
      const { error } = await cloud.database.from('saves')
        .insert({ data: S, owner_name: (S.name || '').trim() || null }).select();
      if(error){
        if(error.code === '23505'){          // 并发下已被其他标签页建行 → 改走更新
          const again = await cloudLoadRow();
          if(again){
            const r2 = await cloud.database.from('saves')
              .update({ data: S, owner_name: (S.name || '').trim() || null, updated_at: new Date().toISOString() })
              .eq('id', again.id).select();
            if(r2.error) throw r2.error;
          }
        }else{
          throw error;
        }
      }
    }
    pushFailed = false;
  }catch(e){
    if(!pushFailed){
      pushFailed = true;
      toast('⚠️ 云端存档同步失败：'+((e && e.message) || '网络错误，请稍后自动重试'),'bad');
    }
  }finally{
    pushing = false;
    if(pushQueued){ pushQueued = false; pushSave(); }
  }
}

/* ---------------- 属性计算 ---------------- */
function eqStats(){
  const st = {speed:0, rareUp:0, nestT:0, crit:0, offline:0, big:0, depth:0,
              atk:0, capacity:0, resource:0};
  SLOTS.forEach(sl=>{
    const e = S.equip[sl.id]; if(!e) return;
    const rc = EQ_RARITY[e.rarity]; const lv = e.lv;
    const tier = RORDER.indexOf(e.rarity); // 0..5
    const lvMul = 1 + (lv-1)*0.052;
    // 各部位主属性
    if(sl.id==='rod')    st.speed   += (0.10 + tier*0.085) * lvMul + e.enhance*0.022;
    if(sl.id==='line')   st.depth   += Math.round((1 + tier*2.2) * lvMul) + Math.floor(e.enhance/4);
    if(sl.id==='float')  st.crit    += (0.035 + tier*0.022) * lvMul + e.enhance*0.004;
    if(sl.id==='basket') st.capacity+= Math.round((28 + tier*118) * lvMul) + e.enhance*7;
    if(sl.id==='suit')   st.resource+= (0.07 + tier*0.058) * lvMul + e.enhance*0.016;
    if(sl.id==='glove')  st.big     += (0.045 + tier*0.032) * lvMul + e.enhance*0.010;
    // 词条
    (e.words||[]).forEach(w=>{
      const def = EQ_WORDS.find(x=>x.id===w.id); if(!def) return;
      const v = def.base + def.per*w.roll + def.per*e.enhance*0.55;
      if(def.stat==='depth') st.depth += Math.round(v);
      else st[def.stat] = (st[def.stat]||0) + v/100;
    });
  });
  st.depth = Math.max(1, Math.min(99, st.depth));
  return st;
}
function setBonus(){
  const cnt = {};
  SLOTS.forEach(sl=>{ const r=S.equip[sl.id]?.rarity||'common'; cnt[r]=(cnt[r]||0)+1; });
  let best = null, bestOrder = -1;
  for(const r in cnt){ if(cnt[r]>=3 && RORDER.indexOf(r)>bestOrder){ bestOrder=RORDER.indexOf(r); best=r; } }
  if(!best) return {count:0, rarity:null, speed:0, nestDecay:0, nestT:0, legendUp:0, offlineSafe:false, tier:0};
  const n = cnt[best]; const tier = bestOrder;
  return {
    count:n, rarity:best, tier,
    speed: n>=6 ? 0.30+tier*0.03 : 0.15+tier*0.02,
    nestDecay: n>=6 ? 0.40 : 0.20,
    nestT: n>=6 ? 0.30 : 0,
    legendUp: n>=6 ? 0.55+tier*0.09 : 0,
    offlineSafe: n>=6,
  };
}
function nestDuration(baitId){
  const b = BAITS.find(x=>x.id===baitId); if(!b) return 0;
  const st = eqStats(), sb = setBonus();
  return b.dur * 1000 * (1 + st.nestT + sb.nestT);
}
/* 当前窝点剩余与强度倍率 */
function nestState(){
  const n = S.nest;
  if(!n.baitId || !n.endAt) return {active:false, mul:1, remain:0, pct:0, bait:null, phase:''};
  const now = Date.now();
  if(now >= n.endAt){ return {active:false, mul:1, remain:0, pct:0, bait:BAITS.find(b=>b.id===n.baitId), phase:'expired'}; }
  const total = n.endAt - n.startAt;
  const elapsed = now - n.startAt;
  const pct = Math.max(0, Math.min(1, elapsed/total));
  // 前2分钟(或在10%时长内, 取小)为爆发期
  const burstMs = Math.min(120000, total*0.18);
  let mul; let phase;
  if(elapsed <= burstMs){ mul = 1; phase='爆发期'; }
  else{
    const k = (elapsed-burstMs)/Math.max(1,(total-burstMs));
    const sb = setBonus();
    const decay = 1 - (1-sb.nestDecay)*0; // 套装降低衰减：把最低衰减抬升
    // 基础衰减到 30%，套装使衰减速度降低
    const floor = 0.30 + sb.nestDecay*0.35;
    const raw = 1 - (1-floor)*k;
    // 套装再抬高一档
    mul = Math.min(1, raw + sb.nestDecay*0.12*(1-k));
    phase = mul>0.7 ? '稳窝期' : (mul>0.45 ? '衰减期' : '尾声');
  }
  return {active:true, mul, remain:n.endAt-now, pct, bait:BAITS.find(b=>b.id===n.baitId), phase, burst: elapsed<=burstMs, target:n.target};
}
function basketLimit(){
  const st = eqStats();
  return S.basketLimitBase + st.capacity;
}
function basketCount(){ let n=0; for(const k in S.basket) n += (S.basket[k] && S.basket[k].n) || 0; return n; }
function levelNeed(lv){ return Math.round(120*Math.pow(1.28, lv-1)); }

/* ---------------- 出货概率引擎 ---------------- */
function rollFish(){
  const spot = SPOTS.find(s=>s.id===S.spot);
  const st = eqStats(), sb = setBonus(), ns = nestState();
  const bait = ns.active ? BAIT_BONUS[ns.baitId] : null;

  // 基础权重
  let w = {};
  RORDER.forEach(r=> w[r] = spot.weights[r] || 0.0001);

  // 深度：稀有及以上加权，普通减权
  const depthBonus = 1 + (st.depth / 100) * 0.55;
  w.rare  *= depthBonus; w.epic *= depthBonus*1.05; w.legend *= depthBonus*1.1; w.mystic *= depthBonus*1.15;
  w.common *= Math.max(0.45, 1 - (st.depth/100)*0.42);

  // 装备 rareUp 词条
  const rareUp = 1 + st.rareUp;
  ['rare','epic','legend','mystic'].forEach(r=> w[r] *= rareUp);

  // 窝料
  if(bait){
    if(bait.lowUp > 0){ w.common *= 1 + bait.lowUp*0.55*speedScale(ns); w.good *= 1 + bait.lowUp*0.3*speedScale(ns); }
    else { w.common *= Math.max(0.06, 1 + bait.lowUp*speedScale(ns)); w.good *= Math.max(0.35, 1 + bait.lowUp*0.5*speedScale(ns)); }
    w.rare   *= 1 + (bait.rareMul-1)*speedScale(ns);
    w.epic   *= 1 + (bait.epicMul-1)*speedScale(ns);
    w.legend *= 1 + (bait.legendMul-1)*speedScale(ns);
    if(bait.mysticAdd>0){ w.mystic = Math.max(w.mystic, 0.6) * (1 + bait.mysticAdd*20*speedScale(ns)); }
  }
  // 精准打窝：压制非目标品级
  if(ns.active && ns.target){
    const to = RARITY[ns.target].order;
    RORDER.forEach(r=>{ const o=RARITY[r].order; if(o<to) w[r] *= 0.22; else if(o===to) w[r] *= 2.4; });
  }
  // 全域鱼潮
  if(ENV.tideUntil > Date.now()){
    ['rare','epic','legend','mystic'].forEach(r=> w[r] *= 2.35);
    w.common *= 0.5;
  }
  // 套装6件传说加权
  if(sb.legendUp>0){ w.legend *= 1+sb.legendUp; w.mystic *= 1+sb.legendUp*0.5; }

  // 随机波动
  RORDER.forEach(r=> w[r] *= 0.88 + Math.random()*0.26);

  let total=0; RORDER.forEach(r=> total+=w[r]);
  let x = Math.random()*total, pick='common';
  for(const r of RORDER){ x -= w[r]; if(x<=0){ pick=r; break; } }
  return pick;
}
function speedScale(ns){ return ns.active ? Math.max(0.25, ns.mul) : 0; }

/* ---------------- 核心：一次上钩判定 ---------------- */
function doCast(){
  const st = eqStats(), sb = setBonus(), spot = SPOTS.find(s=>s.id===S.spot), ns = nestState();
  S.stats.totalCasts++;

  // 鱼篓满则暂停
  if(basketCount() >= basketLimit()){ pauseAuto('鱼篓已满'); return; }

  // 空钩判定
  let emptyRate = 0.115 - st.speed*0.30 - (sb.speed*0.10);
  const bait = ns.active ? BAIT_BONUS[ns.baitId] : null;
  if(bait) emptyRate += bait.empty * speedScale(ns);
  if(ENV.tideUntil>Date.now()) emptyRate -= 0.06;
  // 闹窝暴击：不空钩
  const frenzy = Date.now() < ENV.frenzyUntil;
  if(frenzy) emptyRate = 0;
  emptyRate = Math.max(0.004, Math.min(0.32, emptyRate));

  if(Math.random() < emptyRate){
    pxEventNibble();
    if(Math.random()<0.34) pushLog('浮漂纹丝不动，今日喜提<b class="t-common">空军</b>！钓鱼佬永不空军，实在不行捞点水草凑数😂', 'log-sys');
    else if(Math.random()<0.5) pushLog('水面动了动…但只是'+raritySpan('common','水波'), 'log-sys');
    return;
  }

  // 鱼潮上钩速度翻倍 → 额外判定一次（等效提高产量）
  let rolls = 1;
  if(ENV.tideUntil>Date.now() && Math.random()<0.55) rolls = 2;
  if(frenzy && Math.random()<0.75) rolls = 2;

  let gained = [];
  for(let i=0;i<rolls;i++) gained.push(rollFish());

  // 暴击判定（鱼漂）
  let critRate = st.crit + (frenzy?0.45:0) + (ENV.tideUntil>Date.now()?0.12:0);
  critRate = Math.min(0.85, critRate);
  const crit = Math.random() < critRate;

  // 巨物脱钩判定
  const isBig = Math.random() < (ns.active && ns.baitId==='divine' ? 0.10 : 0.028) * (1 + sb.tier*0.08);
  const escapeRate = isBig ? Math.max(0.02, 0.42 - st.big - (frenzy?0.2:0)) : 0;
  if(isBig && Math.random() < escapeRate){
    const kind = Math.random() < 0.5 ? 'shake' : 'break';
    pxEventLost('legend', kind);
    if(kind==='break') pushLog('咻！直接<b class="t-legend">切线</b>！大鱼带着鱼钩远走高飞！','log-bad');
    else pushLog('哦豁！大鱼<b class="t-legend">洗鳃脱钩</b>，到嘴的鱼飞了，心痛！（防滑手套可降低脱钩率）','log-bad');
    ENV.stats_bigFail = (ENV.stats_bigFail||0)+1;
    return;
  }

  const resMul = 1 + st.resource + sb.speed*0.2;
  const spotMul = spot.rate;
  const satMul = (ENV.satietyUntil>Date.now()) ? (1 + ENV.satiety) : 1;

  let cap = basketLimit();
  // 取本次最高品级 → 驱动像素动画分档
  let topR = 'common';
  gained.forEach(r=>{ if(RARITY[r].order > RARITY[topR].order) topR = r; });
  const topOrder = RARITY[topR].order;
  // 动画里展示的鱼=实际进篓的那条（同名同款），避免「钓上来的和看到的不一样」
  const showcase = makeFish(topR);
  let topUsed = false;
  pxEventBite(topR, showcase.name);

  gained.forEach(r=>{
    const fish = (!topUsed && r===topR) ? (topUsed = true, showcase) : makeFish(r);
    let qty = 1;
    if(crit) qty *= 2;
    if(isBig) qty = Math.max(qty, 2);
    // 鱼篓容量检查
    const room = cap - basketCount();
    if(room <= 0) return;
    if(qty > room) qty = room;
    S.basket[fish.id] = S.basket[fish.id] || {fish, n:0};
    S.basket[fish.id].n += qty;
    S.stats.totalFish += qty;
    S.stats.rareGain[r] = (S.stats.rareGain[r]||0) + qty;
    S.daily.fishScore += RARITY[r].exp * qty * 3;
    if(RARITY[r].order>=2) S.daily.rareScore += RARITY[r].exp * qty * 6;
    addExp(RARITY[r].exp * qty);

       (RARITY[r].order === RARITY[S.stats.best.r].order && fish.price>S.stats.best.price)){

    }else if(RARITY[r].order<=3){
      pushLog((isBig?'🌊 ':'')+'漂亮！<b class="t-'+RARITY[r].cls+'">正口上鱼</b>，手感拉满，这波没白守窝！ —— '+raritySpan(r,'【'+fish.name+'】')+' ×'+qty+(crit?' <b class="t-legend">暴击!</b>':'')+' 估值 '+fmt(fish.price*qty)+' 金币', cls);
      toast('🎣 正口上鱼 '+fish.name, 'good');
    }else{
      pushLog('🏆 <b class="t-'+RARITY[r].cls+'">巨物出水！</b>泄力滋滋响，差点切线！稳住了！ —— 【'+esc(fish.name)+'】 ×'+qty+(crit?' <b class="t-legend">暴击!</b>':'')+' 估值 '+fmt(fish.price*qty)+' 金币', cls);
      toast('🎉 巨物出水 '+fish.name, r==='mystic'?'mystic':'gold');
      // 传说 / 神隐：在动画画面内弹出彩色像素鱼图标（而非仅日志提示）
      if(RARITY[r].order >= 2) pxPopupCatch(r, fish);
    }
  });

  if(frenzy && Math.random()<0.30){
    pushLog('🔥 <b class="t-legend">闹窝暴击</b>中！连续上钩，绝不空钩', 'log-big');
  }
  if(basketCount() >= cap){ pauseAuto('鱼篓已满'); }
}

function addExp(n){
  S.exp += n;
  let need = levelNeed(S.lv);
  let ups=0;
  while(S.exp >= need){ S.exp -= need; S.lv++; ups++; need = levelNeed(S.lv); }
  if(ups){ pushLog('⬆️ 钓手等级提升至 <b class="t-legend">Lv.'+S.lv+'</b>', 'log-big'); }
}

/* ---------------- 打窝 ---------------- */
function doNest(baitId, target){
  const ns = nestState();
  if(ns.active && ns.baitId===baitId && !target){
    toast('同品级窝料不可叠加效果，仅可叠加时长','bad'); return;
  }
  const b = BAITS.find(x=>x.id===baitId); if(!b) return;
  // 免费窝料优先
  if(S.freeBaits[baitId] > 0){ S.freeBaits[baitId]--; }
  else{
    if((b.cost.gold||0) > S.gold){ toast('金币不足（需 '+fmt(b.cost.gold)+'）','bad'); return; }
    if((b.cost.ess||0) > S.ess){ toast('钓鱼精华不足（需 '+fmt(b.cost.ess)+'）','bad'); return; }
    S.gold -= b.cost.gold||0; S.ess -= b.cost.ess||0;
  }
  const dur = nestDuration(baitId);
  const now = Date.now();
  if(ns.active && ns.baitId===baitId){
    // 叠时长
    S.nest.endAt = Math.max(S.nest.endAt, now) + dur*0.7;
    pushLog('＋ 叠加时长：'+b.ico+' '+b.name+' 延长至 '+fmtTime(S.nest.endAt-now),'log-tip');
  }else if(ns.active && b.tier < ns.bait.tier){
    // 低品质作为辅助增益：延长少量时长
    S.nest.endAt = S.nest.endAt + dur*0.25;
    ENV.satietyBoost = (ENV.satietyBoost||0) + 0.06;
    pushLog('＋ '+b.name+' 作为辅助增益叠加，延长窝点 '+fmtTime(dur*0.25),'log-tip');
  }else{
    S.nest = {baitId, endAt: now+dur, startAt: now, target: target||null, tier:b.tier, castAt: now};
  }
  S.nestCasts++;
  S.food.lastClaim = S.food.lastClaim;
  const b2 = BAITS.find(x=>x.id===baitId);
  pushLog('🪣 打窝：'+b2.ico+' <b class="t-rare">'+b2.name+'</b>' + (target?' <span class="t-epic">（精准目标：'+RARITY[target].name+'）</span>':'') + ' 持续 '+fmtTime(S.nest.endAt-now), 'log-big');
  pushLog('🎣 饵团入水，静待发窝！钓友名言：要想鱼上岸，就得粮食换','log-tip');
  // 像素动画：阶段1 抛钩
  pxEventCast();
  // 万窝聚鱼（多人同时打窝：概率触发）
  if(Math.random() < 0.18 && S.nestCasts>1){
    triggerTide('万窝聚鱼', true);
    return;   // triggerTide 内部已 renderAll/save
  }
  // 闹窝暴击
  if(Math.random() < 0.30 + (b.tier-1)*0.06){
    ENV.frenzyUntil = Date.now() + 15000;
    pushLog('🔥🔥 <b class="t-legend">闹窝暴击！</b>15秒超高爆率，连续上钩不空钩','log-legend');
    toast('🔥 闹窝暴击！15秒狂暴上钩','gold');
    pxSetScene('nest');
  }
  renderAll(); save();
}
function triggerTide(name, force){

function sellAll(){
  let gold=0, ess=0, cnt=0;
  const st = eqStats(), sb = setBonus();
  const mul = 1 + st.resource + sb.speed*0.15;
  for(const k in S.basket){
    const it = S.basket[k];
    const r = it.fish.rarity;
    const g = Math.round(it.fish.price * it.n * mul);
    gold += g; cnt += it.n;
    if(RARITY[r].order>=2) ess += Math.max(1, Math.round(it.n * (RARITY[r].order-1) * (1+st.resource*0.5)));
  }
  if(cnt===0){ toast('鱼篓是空的','bad'); return; }
  S.gold += gold; S.ess += ess;
  S.stats.totalGold += gold; S.stats.totalEss += ess;
  S.basket = {};
  pushLog('💰 售卖 '+cnt+' 条鱼获，获得 <b class="t-legend">'+fmt(gold)+'</b> 金币、<b class="t-mystic">'+fmt(ess)+'</b> 精华','log-big');
  toast('💰 +'+fmt(gold)+' 金币 / +'+fmt(ess)+' 精华','gold');
  if(!S.auto && basketCount()<basketLimit()){ S.auto=true; pushLog('▶️ 鱼篓已清空，自动挂机恢复','log-tip'); }
  renderAll(); save();
}
function sellOne(key){
  const it = S.basket[key]; if(!it) return;
  const st = eqStats(); const mul = 1+st.resource;
  const g = Math.round(it.fish.price*it.n*mul);
  let ess = 0;
  const o = RARITY[it.fish.rarity].order;
  if(o>=2) ess = Math.max(1, Math.round(it.n*(o-1)));
  S.gold+=g; S.ess+=ess; S.stats.totalGold+=g; S.stats.totalEss+=ess;
  delete S.basket[key];
  toast('卖出 '+it.fish.name+' +'+fmt(g)+'金','good');
  if(!S.auto && basketCount()<basketLimit()) S.auto=true;
  renderAll(); save();
}

/* ---------------- 装备操作 ---------------- */
function upCost(e){
  const tier = RORDER.indexOf(e.rarity);
  return {
    gold: Math.round((120 + tier*950) * Math.pow(1.16, e.lv-1)),
    ess: e.lv>=15 ? Math.round((e.lv-14) * (tier+1) * 2.2) : 0
  };
}
function upgradeEquip(slot){
  const e = S.equip[slot]; const rc = EQ_RARITY[e.rarity];
  if(e.lv >= rc.maxLv){ toast('已达当前品级等级上限，请先进阶','bad'); return; }
  const c = upCost(e);
  if(S.gold < c.gold){ toast('金币不足（需 '+fmt(c.gold)+'）','bad'); return; }
  if(c.ess && S.ess < c.ess){ toast('钓鱼精华不足（需 '+fmt(c.ess)+'）','bad'); return; }
  S.gold -= c.gold; if(c.ess) S.ess -= c.ess;
  e.lv++;
  pushLog('🔧 '+SLOTS.find(s=>s.id===slot).name+' 升级至 <b class="t-good">Lv.'+e.lv+'</b>','log-tip');
  renderAll(); save();
}
function enhanceCost(e){
  const tier = RORDER.indexOf(e.rarity);
  return { ess: Math.round((8 + tier*22) * Math.pow(1.22, e.enhance)) };
}
function enhanceEquip(slot){
  const e = S.equip[slot];
  if(e.enhance >= 20){ toast('该装备强化已满（+20）','bad'); return; }
  const c = enhanceCost(e);
  if(S.ess < c.ess){ toast('钓鱼精华不足（需 '+fmt(c.ess)+'）','bad'); return; }
  S.ess -= c.ess;
  const rate = Math.max(0.22, 0.92 - e.enhance*0.035);
  if(Math.random() < rate){
    e.enhance++;
    pushLog('⚒️ 强化成功！'+SLOTS.find(s=>s.id===slot).name+' <b class="t-legend">+'+e.enhance+'</b>','log-big');
    toast('⚒️ 强化成功 +'+e.enhance,'gold');
  }else{
    pushLog('⚒️ 强化失败（不掉级，少量材料损耗）','log-sys');
    toast('强化失败，材料未掉级','bad');
  }
  renderAll(); save();
}
function reforgeCost(e){
  const tier = RORDER.indexOf(e.rarity);
  return Math.round((30 + tier*60) * Math.pow(1.18, (e.reforge||0))) ;
}
function reforgeWords(slot){
  const e = S.equip[slot]; const rc = EQ_RARITY[e.rarity];
  if(rc.words===0){ toast('白/绿装无专属词条，无法洗练','bad'); return; }
  const cost = reforgeCost(e);
  if(S.ess < cost){ toast('钓鱼精华不足（需 '+fmt(cost)+'）','bad'); return; }
  S.ess -= cost; e.reforge = (e.reforge||0)+1;
  const ids = EQ_WORDS.map(w=>w.id).sort(()=>Math.random()-0.5).slice(0, rc.words);
  e.words = ids.map(id=>({id, roll: 0.4 + Math.random()*0.6}));
  const names = e.words.map(w=>{ const d=EQ_WORDS.find(x=>x.id===w.id); const v=Math.round(d.base+d.per*w.roll); return d.name+' +'+v+(d.suffix||''); });
  pushLog('✨ 洗练完成：'+names.join('，'),'log-rare');
  toast('✨ 洗练出 '+rc.words+' 条词条','good');
  renderAll(); save();
}
function advanceCost(e){
  const tier = RORDER.indexOf(e.rarity);
  if(tier>=5) return null;
  return { mats: e.lv >= EQ_RARITY[e.rarity].maxLv - 1 ? 1 : 0, gold: Math.round(4000*Math.pow(2.1,tier)), ess: Math.round(60*Math.pow(1.95,tier)) };
}
function advanceEquip(slot){
  const e = S.equip[slot]; const tier = RORDER.indexOf(e.rarity);
  if(tier>=5){ toast('已是最高品级鸿蒙','bad'); return; }
  const rc = EQ_RARITY[e.rarity];
  if(e.lv < rc.maxLv){ toast('需先升满当前品级等级（Lv.'+rc.maxLv+'）才能进阶','bad'); return; }
  const c = advanceCost(e);
  if(S.gold < c.gold){ toast('金币不足（需 '+fmt(c.gold)+'）','bad'); return; }
  if(S.ess < c.ess){ toast('钓鱼精华不足（需 '+fmt(c.ess)+'）','bad'); return; }
  S.gold -= c.gold; S.ess -= c.ess;
  const next = RORDER[tier+1];
  e.rarity = next; e.lv = 1; e.enhance = 0;
  const rc2 = EQ_RARITY[next];
  if(rc2.words>0){
    const ids = EQ_WORDS.map(w=>w.id).sort(()=>Math.random()-0.5).slice(0, rc2.words);
    e.words = ids.map(id=>({id, roll: 0.4+Math.random()*0.6}));
  }
  pushLog('🌟 <b class="t-legend">装备进阶！</b>'+SLOTS.find(s=>s.id===slot).name+' → '+raritySpan(next, EQ_RARITY[next].name+'品质'),'log-legend');
  toast('🌟 进阶 '+EQ_RARITY[next].name+' 成功！','gold');
  renderAll(); save();
}

/* ---------------- 离线结算 ---------------- */
function offlineSettle(){
  const now = Date.now();
  const away = now - (S.lastOnline||now);
  if(away < 60000) return;
  const capped = Math.min(away, 8*3600*1000); // 最多8小时
  const st = eqStats(), sb = setBonus();
  const ofMul = 1 + st.offline*0 + (S.equip.suit? 0:0); // offline 由词条提供
  const offBonus = st.offline;
  const casts = Math.floor(capped/10000);
  // 模拟粗略产出
  let gold=0, ess=0, cnt=0, rares=0;
  const spot = SPOTS.find(s=>s.id===S.spot);
  const eff = casts * 0.62 * (1+offBonus) * (sb.offlineSafe?1.15:1);
  const fishC = Math.floor(eff);
  // 简化：按渔场权重分布统计
  let totalW=0; const ws={};
  RORDER.forEach(r=>{ ws[r]=(spot.weights[r]||0.001) + (r==='mystic'?0:0); totalW+=ws[r]; });
  for(let i=0;i<fishC;i++){
    let x=Math.random()*totalW, pick='common';
    for(const r of RORDER){ x-=ws[r]; if(x<=0){ pick=r; break; } }
    if(!sb.offlineSafe && RARITY[pick].order>=4 && Math.random()<0.35) pick='epic'; // 无6件套时稀有掉档
    cnt++;
    gold += RARITY[pick].sell * spot.rate;
    if(RARITY[pick].order>=2) ess += (RARITY[pick].order-1);
    if(RARITY[pick].order>=3) rares++;
  }
  gold = Math.round(gold * (1+st.resource) * 0.85);
  ess = Math.round(ess * 0.8);
  if(S.basketLimitBase + 0){}
  const cap = basketLimit();
  if(cnt > cap){ cnt = cap; }
  if(cnt<=0){ return; }
  // 离线鱼获不塞进鱼篓（避免立刻满仓），直接折现
  S.gold += gold; S.ess += ess;
  S.stats.totalGold += gold; S.stats.totalEss += ess; S.stats.totalFish += cnt;
  const h = Math.floor(capped/3600000), m = Math.floor((capped%3600000)/60000);
  const durTxt = (h>0? h+'小时':'') + m + '分钟';
  pushLog('🌙 <b>离线挂机结算</b>（离开 '+durTxt+'）','log-big');
  pushLog('　已自动转换为：<b class="t-legend">'+fmt(gold)+'</b> 金币、<b class="t-mystic">'+fmt(ess)+'</b> 精华，共 '+fmt(cnt)+' 条鱼获','log-tip');
  if(offBonus>0) pushLog('　离线收益加成：<b class="t-good">+'+Math.round(offBonus*100)+'%</b>','log-tip');
  if(!sb.offlineSafe && rares>0) pushLog('　提示：集齐 6 件同品级套装可解锁「永窝」，离线稀有鱼不掉档','log-sys');
  toast('🌙 离线收益已到账：'+fmt(gold)+' 金币','gold');
  S.lastOnline = now;
}

/* ---------------- 摸鱼福利 ---------------- */
function checkWelfare(){
  const now = Date.now();
  const playMs = now - S.created;
  // 每累计30分钟发一次
  const tiers = Math.floor(playMs / (30*60000));

    toast('🎁 摸鱼福利到账！','gold');
  }
}

      <div class="tiny" style="margin-top:4px">${s.desc}</div>
      <div class="tiny" style="margin-top:3px">需 Lv.${s.minLv} · 深度 ${s.depth} · 出货 ×${s.rate.toFixed(2)}${lock?' · <span style="color:#ff9aa2">未解锁</span>':''}</div></div>`;

function estimateWeights(){
  const spot = SPOTS.find(s=>s.id===S.spot);
  const st = eqStats(), sb = setBonus(), ns = nestState();
  const bait = ns.active ? BAIT_BONUS[ns.baitId] : null;
  let w = {}; RORDER.forEach(r=> w[r]=spot.weights[r]||0.0001);
  const db = 1 + (st.depth/100)*0.55;
  w.rare*=db; w.epic*=db*1.05; w.legend*=db*1.1; w.mystic*=db*1.15;
  w.common*=Math.max(0.45,1-(st.depth/100)*0.42);
  const rareUp = 1+st.rareUp; ['rare','epic','legend','mystic'].forEach(r=>w[r]*=rareUp);
  if(bait){
    const ss = speedScale(ns);
    if(bait.lowUp>0){ w.common*=1+bait.lowUp*0.55*ss; w.good*=1+bait.lowUp*0.3*ss; }
    else{ w.common*=Math.max(0.06,1+bait.lowUp*ss); w.good*=Math.max(0.35,1+bait.lowUp*0.5*ss); }
    w.rare*=1+(bait.rareMul-1)*ss; w.epic*=1+(bait.epicMul-1)*ss; w.legend*=1+(bait.legendMul-1)*ss;
    if(bait.mysticAdd>0) w.mystic=Math.max(w.mystic,0.6)*(1+bait.mysticAdd*20*ss);
  }
  if(ns.active && ns.target){ const to=RARITY[ns.target].order;
    RORDER.forEach(r=>{ const o=RARITY[r].order; if(o<to) w[r]*=0.22; else if(o===to) w[r]*=2.4; }); }
  if(ENV.tideUntil>Date.now()){ ['rare','epic','legend','mystic'].forEach(r=>w[r]*=2.35); w.common*=0.5; }
  if(sb.legendUp>0){ w.legend*=1+sb.legendUp; w.mystic*=1+sb.legendUp*0.5; }
  return w;
}

    pushLog('🔄 换场成功，原窝点效果已清零','log-sys'); }

    const row = await cloudLoadRow();
    if(row){
      const { data, error } = await cloud.database.from('saves').delete().eq('id', row.id).select();
      if(error) throw error;
      if(!Array.isArray(data) || !data.length) throw new Error('存档删除未生效');
    }
  }catch(e){
    toast('重置失败：'+((e && e.message) || '云端错误'),'bad'); return;
  }

    return seq[Math.floor(PX.frame/4)%seq.length];
  }
  return PAL.rare[r] || PAL.gray;
}

/* ---- 鱼种外观：由「鱼名+品质」稳定生成 体形/配色/花纹 ----
 *  同一条鱼每次出现长得一样（名字哈希做种子），
 *  不同鱼种体形、色相、花纹不同 —— 告别「同品质一个纯色块」。 */
const _fishLookCache = {};
function pxHashStr(s){
  let h = 2166136261;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
/** hex 颜色在 HSL 空间旋转色相（返回 hex，保证 pxHex/pxMix 可继续处理） */
function pxHueRot(hex, deg){
  const p = pxHex(hex);
  let r = p[0]/255, g = p[1]/255, b = p[2]/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b);
  let h = 0; const l = (mx+mn)/2;
  let s = 0;
  if(mx !== mn){
    const d = mx-mn;
    s = l > 0.5 ? d/(2-mx-mn) : d/(mx+mn);
    if(mx === r) h = (g-b)/d + (g < b ? 6 : 0);
    else if(mx === g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h *= 60;
  }
  h = (h + deg + 360) % 360;
  const c = (1 - Math.abs(2*l - 1)) * s;
  const x = c * (1 - Math.abs((h/60) % 2 - 1));
  const m = l - c/2;
  let rp, gp, bp;
  if(h < 60){ rp=c; gp=x; bp=0; }
  else if(h < 120){ rp=x; gp=c; bp=0; }
  else if(h < 180){ rp=0; gp=c; bp=x; }
  else if(h < 240){ rp=0; gp=x; bp=c; }
  else if(h < 300){ rp=x; gp=0; bp=c; }
  else { rp=c; gp=0; bp=x; }
  const to = v => ('0'+Math.round((v+m)*255).toString(16)).slice(-2);
  return '#'+to(rp)+to(gp)+to(bp);
}
function pxFishLook(name, rarity){
  const key = rarity + '|' + name;
  if(_fishLookCache[key]) return _fishLookCache[key];
  const seed = pxHashStr(key);
  /* 体形档位：按本体关键词分五类（长条/短圆/修长/粗壮/标准） */
  let shape = 'std';
  if(/鳗|鳅|鳝|鲥|鳗鲡/.test(name)) shape = 'eel';
  else if(/鲀|虾虎|麦穗|鲳|鳌/.test(name)) shape = 'chub';
  else if(/鲟|鳢|鳐|鲶|鲇|鳊|翘嘴|黄颡|军鱼/.test(name)) shape = 'long';
  else if(/鲲|鯤|鲸|豚|龙|影|灵|蜃|哲罗/.test(name)) shape = 'whale';
  /* 配色：品质基色 + ±26° 色相偏移 —— 品质仍一眼可辨，但每条鱼色调不同 */
  const baseCol = rarity === 'mystic' ? '#c857e8' : (PAL.rare[rarity] || '#9fb6c4');
  const mid = pxHueRot(baseCol, (seed % 53) - 26);
  /* 花纹：0无 1斑点 2竖纹 3横带，花纹色取偏亮的对比色 */
  const patType = seed % 4;
  const patCol = pxHueRot(baseCol, (seed % 53) - 26 + (seed % 2 ? 150 : -150));
  const look = {
    mid, patType, patCol, shape, seed,
    whisker: /鲶|鲇|鲤|龙|鲲|鯤/.test(name),
  };
  _fishLookCache[key] = look;
  return look;
}
/** 取当前应显示的渔场（切场淡出期间仍显示旧 skin） */
function pxSkin(){ return PX.skin || SPOT_SKIN[SPOT_ORDER[0]]; }

/* ---- 场景控制 ---- */
function pxSetScene(state, opt){
  opt = opt || {};
  const s = PX.scene;
  s.state = state; s.t = 0;
  s.fishRarity = opt.rarity || s.fishRarity;
  s.fishSize = opt.size || 'small';
  if(opt.name !== undefined) s.fishName = opt.name;   // 鱼名 → 决定这条鱼长什么样
  s.result = opt.result || '';
  s.phase = opt.phase || '';
  // 全域事件占用独立时长，避免被环境检查立即打回等待
  if(state==='nest') PX.nestUntil = Date.now() + 12000;
  if(state==='tide') PX.tideUntil = Date.now() + 12000;
  // 咬钩/跑鱼 → 给船体一个初始摆动冲量（鱼越大摆得越猛）
  if(state==='bite' || state==='lost'){
    const o = RARITY[s.fishRarity] ? RARITY[s.fishRarity].order : 0;
    const power = s.fishSize==='big' ? 7.5 : (s.fishSize==='mid' ? 3.2 : 1.2);
    pxSwayImpulse((PX.frame%2 ? 1 : -1) * power, o);
  }
  // 起鱼 → 轻微回摆
  if(state==='reel') pxSwayImpulse(s.fishSize==='big' ? 3.5 : 1.6, 0);
  pxSyncWindowCls();
  if(PX.on && !PX.raf) pxStart();
}
/** 船体摆动冲量：v 为初速度，order 越高衰减越慢（巨物拖拽感） */
function pxSwayImpulse(v, order){
  PX.swayV += v;
}
function pxSyncWindowCls(){
  const w = document.getElementById('pixelWin');
  if(!w) return;
  w.classList.toggle('tide', ENV.tideUntil > Date.now());
  w.classList.toggle('frenzy', (ENV.frenzyUntil||0) > Date.now());
  w.classList.toggle('full', typeof basketCount==='function' && S && basketCount() >= basketLimit());
}
function pxShake(){
  const w = document.getElementById('pixelWin');
  if(!w || !PX.on) return;
  w.classList.remove('shake');
  void w.offsetWidth;
  w.classList.add('shake');
  setTimeout(()=>w.classList.remove('shake'), 360);
}

/* ---- 启动 / 停止 ---- */
function pxStart(){
  if(!PX.on || PX.raf) return;
  PX.cv = document.getElementById('pixelCv');
  if(!PX.cv) return;
  PX.ctx = PX.cv.getContext('2d');
  PX.ctx.imageSmoothingEnabled = false;
  if(!PX.skin) pxApplySpot(S ? S.spot : SPOT_ORDER[0]);
  let last = 0;
  const loop = (ts)=>{
    PX.raf = requestAnimationFrame(loop);
    const iv = 1000 / PX.fps;
    if(ts - last < iv) return;
    last = ts;
    pxDraw();
  };
  PX.raf = requestAnimationFrame(loop);
}
function pxStop(){
  if(PX.raf){ cancelAnimationFrame(PX.raf); PX.raf = 0; }
}
/** 设置动画开关（同步窗口右上角与 header 两处按钮） */
function pxToggle(force){
  PX.on = (typeof force === 'boolean') ? force : !PX.on;
  const w = document.getElementById('pixelWin');
  if(w) w.classList.toggle('off', !PX.on);
  if(PX.on){ pxStart(); if(S) pxSetScene(PX.scene.state); }
  else pxStop();
  if(S){ S.pxAnim = PX.on; save(); }
  const txt = PX.on ? '🎞️' : '🚫';
  const hero = document.getElementById('btnPixelHero');
  if(hero){ hero.textContent = txt; hero.classList.toggle('on', PX.on); hero.title = PX.on ? '动画开启中 · 点击关闭' : '动画已关闭 · 点击开启'; }
  const btn = document.getElementById('btnPixel');
  if(btn){ btn.textContent = txt; btn.classList.toggle('on', PX.on); }
}
/* 页面不可见时降帧（省电，符合挂机场景）：24fps → 8fps，粒子预算减半 */
function pxOnVisibility(){
  if(document.hidden){ PX.bg = true; PX.fps = 8; }
  else { PX.bg = false; PX.fps = 24; }
}
/** 按动画视窗容器的可用空间等比确定窗口尺寸（宽幅 720/320 永不变形）。
    规则：优先铺满宽度；若由此得到的高度超出容器，则改为按高度等比缩小。
    绝不对单轴单独夹取，因此比例恒定。 */
function pxFitHero(){
  const hero = document.getElementById('animHero');
  const win = document.getElementById('pixelWin');
  if(!hero || !win) return;
  const R = PX.W / PX.H;                       // 2.25
  const availW = hero.clientWidth  - 4;        // 减去 border
  const availH = hero.clientHeight - 4;
  if(availW <= 0 || availH <= 0) return;
  let w = availW, h = w / R;
  if(h > availH){ h = availH; w = h * R; }     // 高度不够 → 等比缩小
  win.style.width  = Math.floor(w) + 'px';
  win.style.height = Math.floor(h) + 'px';
}
/** 切换渔场皮肤（不做淡出，直接替换；供淡入淡出内部调用） */
function pxApplySpot(id){
  PX.skin = SPOT_SKIN[id] || SPOT_SKIN[SPOT_ORDER[0]];
  PX.reflCols = null; PX.reflAge = 99;
  pxClearParticles();
  if(typeof pxReseedShimmer === 'function') pxReseedShimmer();   // 换场时重置水面波光
}
/** 渔场切换：淡出 → 换皮肤 → 淡入（钓手/鱼竿/浮漂不参与淡出，保持连续） */
function pxSwitchSpot(id){
  if(!PX.on){ pxApplySpot(id); return; }
  const f = PX.fade;
  f.pending = id;
  f.dir = -1;            // 开始淡出
  if(!PX.raf) pxStart();
}

/* =========================================================================
   绘制工具层（整数像素，禁用抗锯齿）
   ========================================================================= */
function pxRect(x,y,w,h,c){ PX.ctx.fillStyle=c; PX.ctx.fillRect(x|0,y|0,w|0,h|0); }
function pxPix(x,y,c){ pxRect(x,y,1,1,c); }
/** 横向色带渐变（用 fillRect 铺色带，Hi-Bit 柔化地平线） */
function pxBand(y0,y1,c0,c1,steps){
  const c = PX.ctx, n = steps || 10;
  for(let i=0;i<n;i++){
    const k = i/(n-1);
    c.fillStyle = pxMix(c0,c1,k);
    const yy = Math.round(y0 + (y1-y0)*(i/n));
    const hh = Math.ceil((y1-y0)/n)+1;
    c.fillRect(0, yy, PX.W, hh);
  }
}
/** 十六进制颜色线性插值 */
function pxMix(a,b,k){
  const pa = pxHex(a), pb = pxHex(b);
  const r = Math.round(pa[0]+(pb[0]-pa[0])*k);
  const g = Math.round(pa[1]+(pb[1]-pa[1])*k);
  const bl= Math.round(pa[2]+(pb[2]-pa[2])*k);
  return 'rgb('+r+','+g+','+bl+')';
}
const _hexCache = {};
function pxHex(h){
  if(_hexCache[h]) return _hexCache[h];
  let s = h.replace('#','');
  if(s.length===3) s = s[0]+s[0]+s[1]+s[1]+s[2]+s[2];
  const v = [parseInt(s.slice(0,2),16), parseInt(s.slice(2,4),16), parseInt(s.slice(4,6),16)];
  _hexCache[h] = v;
  return v;
}
/** 半透明叠加层（用于下水体透明度 / 环境光） */
function pxOverlay(y,w,h,color){ pxRect(0,y,w,h,color); }

/* ---- 远景剪影：按 skin.far 生成可复用的山脊/崖壁/墙轮廓 ----
   频率按宽幅 720 降频（山体更绵长）、振幅上调（远山更厚重），
   常量锚定在 720×320 基准上，保证宽画幅远景信息量充足。 */
function pxFarProfile(kind, x){
  // 返回该列的地平线高度偏移（负值向上）。用确定性伪随机保证稳定。
  switch(kind){
    case 'mountains':
      return -(Math.sin(x*0.0082)*22 + Math.sin(x*0.0205+1.7)*12 + Math.sin(x*0.0043+0.4)*32);
    case 'hills':
      return -(Math.sin(x*0.0115+0.8)*15 + Math.sin(x*0.029+2.1)*7 + 9);
    case 'reeds':
      return -(Math.abs(Math.sin(x*0.062))*9 + Math.abs(Math.sin(x*0.155+0.9))*4);
    case 'sea':
      return -(Math.sin(x*0.0066)*5);
    case 'walls': {
      // 峡谷两壁：左右高耸、中间为 V 形幽潭
      const d = Math.abs(x - PX.W/2) / (PX.W/2);
      return -(44 + d*d*118 + Math.sin(x*0.036)*8);
    }
    case 'cliffs': {
      // 海底断崖：左右两侧巨大崖体向下延伸，中间为裂谷
      const d = Math.abs(x - PX.W/2) / (PX.W/2);
      const jag = Math.sin(x*0.026)*13 + Math.sin(x*0.068+1.1)*7;
      return -(30 + Math.pow(d,1.3)*146 + jag);
    }
    default: return 0;
  }
}
/** 绘制远景剪影层（含暮光天空 + 体积云 + 三层大气透视远山 + 岸边林带）
 *  参考图核心：紫粉橙多段暮光、横向拉长体积云、远山多层递减、松林贴岸。 */
function pxDrawFar(){
  const sk = pxSkin(), c = PX.ctx;
  const hz = PX.L.horizon;

  /* ---- R1-1 暮光多段天空：天顶深紫 → 中层粉紫 → 地平线橙金 ---- */
  const top = sk.sky[0], mid = sk.sky[1], low = sk.sky[2];
  // 天顶到中层
  pxBand(0, Math.round(hz*0.42), top, pxMix(top, mid, 0.75), 11);
  // 中层粉紫带（暮光最饱和的一段）
  pxBand(Math.round(hz*0.42), Math.round(hz*0.70), pxMix(top, mid, 0.75), mid, 8);
  // 中层到地平线橙金
  pxBand(Math.round(hz*0.70), hz, mid, low, 8);
  // 地平线最后 13px 提亮：深色渔场（海渊/幽谷）改用冷色微光，
  // 因为对近黑底色叠加白色增幅过小，几乎看不出层次。
  const lowLum = (pxHex(low)[0]+pxHex(low)[1]+pxHex(low)[2])/3;
  const hzLight = lowLum < 46
    ? pxMix(low, '#6fa8c8', 0.34)                  // 暗场：冷青微光（远天光）
    : pxMix(low, '#ffffff', 0.30);                 // 亮场：暖白散射
  pxBand(hz-13, hz, low, hzLight, 4);

  /* ---- R1-2 星空（幽谷 / 海渊等暗场）：天顶稀疏柔光点 ---- */
  if(sk.stars){
    for(let i=0;i<46;i++){
      // 确定性伪随机，避免每帧闪跳
      const hx = (i*97 + (i%7)*53) % PX.W;
      const hy = Math.round((i*29 + (i%5)*17) % Math.round(hz*0.52));
      const tw = 0.28 + Math.abs(Math.sin(PX.frame*0.012 + i*0.9))*0.34;
      c.globalAlpha = tw * 0.7;
      pxPix(hx, hy, i%6===0 ? '#cfe6ff' : '#8fb4d4');
      c.globalAlpha = 1;
    }
  }

  /* ---- R1-3 体积云：横向拉长的暮光云带，缓慢横移 ---- */
  pxDrawClouds(sk, hz);

  /* ---- R1-4 地平线日光晕：以 skin.sun.x 为中心的暖色径向亮区 ---- */
  if(sk.sun && !PX.bg){
    const sx = Math.round(sk.sun.x * PX.W), sy = hz - 6;
    const base = sk.sun.a;
    // 由外向内 5 层，越近越亮（硬像素同心带，不用渐变以保像素感）
    for(let i=5;i>=1;i--){
      const rx = i*46, ry = i*17;
      c.globalAlpha = base * (0.10 + (6-i)*0.055);
      pxRect(sx-rx, sy-ry, rx*2, ry*2, sk.sun.col);
      c.globalAlpha = 1;
    }
    // 日轮本体（柔和小圆盘）
    c.globalAlpha = base*0.75;
    pxRect(sx-11, sy-7, 22, 14, pxMix(sk.sun.col, '#ffffff', 0.42));
    pxRect(sx-7, sy-9, 14, 18, pxMix(sk.sun.col, '#ffffff', 0.30));
    c.globalAlpha = 1;
  }

  /* ---- R2 三层大气透视远山：越远越淡偏紫，中层带日照面 ---- */
  const dk = '#060d14';
  const L1 = pxMix(sk.sky[2], '#8a7ba8', 0.42);   // 最远层：几乎融入天空的紫灰
  const L2 = pxMix(sk.sky[2], dk, 0.46);          // 中层
  const L3 = pxMix(sk.sky[2], dk, 0.80);          // 最近层：深色主体
  const passes = [
    {col:L1, off:16, scale:0.62, al:0.72},
    {col:L2, off: 7, scale:0.86, al:0.90},
    {col:L3, off: 0, scale:1.00, al:1.00},
  ];
  for(let pass=0; pass<passes.length; pass++){
    const P = passes[pass];
    c.fillStyle = P.col;
    c.globalAlpha = P.al;
    for(let x=0;x<PX.W;x++){
      const yy = Math.round(hz + P.off + pxFarProfile(sk.far, x)*P.scale);
      if(yy < hz+P.off) c.fillRect(x, Math.max(0,yy), 1, hz+P.off-yy);
    }
    c.globalAlpha = 1;
    // 中层日照面：山脊下沿向下 3px 的受光边（参考图远山有亮边）
    if(pass === 1){
      c.globalAlpha = 0.30;
      c.fillStyle = pxMix(sk.sky[2], '#ffffff', 0.34);
      for(let x=0;x<PX.W;x++){
        const yy = Math.round(hz + P.off + pxFarProfile(sk.far, x)*P.scale);
        if(yy < hz+P.off) c.fillRect(x, Math.max(0,yy), 1, 2);
      }
      c.globalAlpha = 1;
    }
  }

  /* ---- R3 岸边林带：针叶松林贴岸剪影（近深远浅，夹杂秋色） ---- */
  if(sk.trees) pxDrawTrees(sk, hz);

  /* ---- 中景（近岸元素，位于水面线之上） ---- */
  pxDrawMid(sk);
}

/* ---- 体积云：横向拉长的暮光云带，缓慢横移，双层错位 ----
   参考图的云是扁平拉丝状，颜色偏紫偏粉，边缘柔但不做高斯模糊（保像素感）。 */
function pxDrawClouds(sk, hz){
  const c = PX.ctx;
  if(PX.bg) return;                        // 后台省电：不画云
  const tintTop = pxMix(sk.sky[0], '#c9a6d8', 0.30);   // 高空云偏紫
  const tintLow = pxMix(sk.sky[2], '#ffd0b0', 0.34);   // 低空云偏粉橙
  const bands = [
    {y:0.16, h:5,  n:7,  sp:0.030, col:tintTop, a:0.34},
    {y:0.34, h:6,  n:6,  sp:0.045, col:tintTop, a:0.28},
    {y:0.55, h:5,  n:6,  sp:0.062, col:tintLow, a:0.34},
    {y:0.72, h:4,  n:5,  sp:0.078, col:tintLow, a:0.40},
  ];
  for(let bi=0; bi<bands.length; bi++){
    const B = bands[bi];
    const baseY = Math.round(hz * B.y);
    for(let i=0;i<B.n;i++){
      // 确定性伪随机起点，保证每次刷新云形一致
      const seed = (bi*13 + i*29) % 97;
      const len = 40 + (seed % 7) * 22;                       // 横向拉长
      const cx0 = ((i * 137 + seed * 11 + PX.frame * B.sp * 10) % (PX.W + len)) - len;
      const jitter = ((seed % 5) - 2) * 2;
      const yy = baseY + jitter;
      // 主体（薄而长）
      c.globalAlpha = B.a;
      pxRect(cx0, yy, len, B.h, B.col);
      // 两端收窄（做出拉丝尾迹）
      c.globalAlpha = B.a * 0.7;
      pxRect(cx0 - 10, yy+1, 12, Math.max(1,B.h-2), B.col);
      pxRect(cx0 + len - 2, yy+1, 12, Math.max(1,B.h-2), B.col);
      // 云底受光边（低空云才有，模拟落日打在云底）
      if(bi >= 2){
        c.globalAlpha = B.a * 0.55;
        pxRect(cx0, yy + B.h - 1, len, 1, pxMix(B.col, '#ffffff', 0.52));
      }
      c.globalAlpha = 1;
    }
  }
}

/* ---- R3 岸边针叶松林带：尖塔形松树不等高排列，近深远浅，夹杂秋色 ----
   基线锚定在地平线略下方（贴岸生长），树高按噪声波动，
   秋色树按 skin.trees.autumn 比例出现（参考图右岸成片橙色）。 */
function pxDrawTrees(sk, hz){
  const c = PX.ctx;
  const T = sk.trees;
  const baseY = hz + 2;                    // 树根基线（贴远岸）
  const sway = PX.bg ? 0 : Math.sin(PX.frame * 0.022) * 0.9;   // 整体极缓摇曳
  for(let x=0; x<PX.W; x++){
    // 用确定性伪随机决定「这列是否有树」，簇状分布更像林带
    const n1 = Math.sin(x*0.0173)*0.5 + Math.sin(x*0.0411+1.3)*0.3 + Math.sin(x*0.0892+2.7)*0.2;
    const dens = Math.abs(n1);
    if(dens < 0.30) continue;              // 空隙 → 林带断口
    // 树高 6..30，越密越高
    const hgt = Math.round(7 + dens * 22 + Math.abs(Math.sin(x*0.213))*4);
    // 深度混色：靠上（远）用 far 色，靠下（近）用 near 色
    const k = Math.min(1, hgt/30);
    let col = pxMix(T.far, T.near, k);
    // 秋色树：按 autumn 比例 + 局部簇状判定，避免均匀撒点
    const autumnSeed = (Math.sin(x*0.0563+0.7)+Math.sin(x*0.121+2.1))*0.5;
    if(autumnSeed > (1 - T.autumn*2) && T.autumn > 0){
      col = pxMix(col, '#c4772f', 0.55 + T.autumn*0.35);
    }
    // 树干
    const tx = x + Math.round(sway * k);
    c.fillStyle = col;
    c.fillRect(tx, baseY - hgt, 1, hgt);
    // 尖塔形树冠：自下而上逐层收窄（3 段，模拟针叶锥形）
    const w0 = Math.max(2, Math.round(2 + k*3));
    c.fillRect(tx - w0 + 1, baseY - Math.round(hgt*0.42), w0*2 - 1, Math.round(hgt*0.42));
    c.fillRect(tx - w0 + 2, baseY - Math.round(hgt*0.70), Math.max(1,w0*2 - 3), Math.round(hgt*0.30));
    c.fillRect(tx, baseY - hgt, 1, Math.round(hgt*0.32));
    // 树冠受光侧（参考图树有亮边）
    if(!PX.bg && k > 0.55){
      c.globalAlpha = 0.26;
      c.fillStyle = pxMix(col, '#ffe0b0', 0.5);
      c.fillRect(tx - w0 + 1, baseY - Math.round(hgt*0.42), 1, Math.round(hgt*0.42));
      c.globalAlpha = 1;
    }
  }
}
/** 中景：卵石 / 芦苇 / 浮萍 / 垂藤（画在水面线附近，铺满宽幅） */
function pxDrawMid(sk){
  const c = PX.ctx, wl = PX.L.waterY, W = PX.W;
  const t = PX.frame;
  if(sk.mid==='duckweed'){                  // 浮萍：疏密不均的绿点簇，散布整片水面
    for(let i=0;i<58;i++){
      const x = (i*31 + Math.round(Math.sin(t*0.02+i)*4)) % W;
      const y = wl - 3 - (i%5);
      pxPix(x, y, i%3 ? '#4a6b47' : '#5d8055');
      if(i%4===0) pxPix(x+2, y+2, '#3d5a3a');
    }
  } else if(sk.mid==='pebbles'){            // 卵石滩：沿水面铺开的石群
    for(let i=0;i<46;i++){
      const x = 6 + i*16 + (i%3)*5;
      const y = wl + 6 + (i%4)*3;
      pxRect(x, y, 8, 3, i%2 ? '#3a4650' : '#46535e');
      pxRect(x+1, y-1, 6, 1, '#566470');
    }
  } else if(sk.mid==='shore'){               // 湖岸树影剪影（沿远岸列布）
    for(let i=0;i<18;i++){
      const x = 12 + i*40;
      const h = 10 + (i%3)*6;
      pxRect(x, wl-h, 2, h, '#161f28');
      pxRect(x-3, wl-h, 8, 3, '#1b2731');
      if(i%3===0) pxRect(x+1, wl-h-4, 7, 5, '#1b2731');
    }
  } else if(sk.mid==='vines'){               // 垂藤：自岩壁顶端垂下的细条
    for(let i=0;i<20;i++){
      const x = 10 + i*37;
      const len = 16 + ((i*7)%30);
      const sw = Math.round(Math.sin(t*0.03 + i)*3);
      for(let k=0;k<len;k++){
        pxPix(x + Math.round(Math.sin(k*0.3)*1.5) + sw, 4+k, k%5===0 ? '#3c4d3a' : '#2c3a2c');
      }
    }
  }
}

/* ---- 倒影层：远景剪影上下翻转 + 逐列横向扭曲 ---- */
function pxReflect(){
  const sk = pxSkin(), c = PX.ctx;
  const hz = PX.L.horizon, wl = PX.L.waterY;
  const depth = wl - hz;                       // 可倒影的水面高度
  if(depth <= 2) return;
  // 扭曲强度：咬钩拉锯 ×2.2，跑鱼/巨物 ×3
  const st = PX.scene.state;
  let warp = (sk.rock || 1) * 0.9;
  if(st==='bite') warp *= (PX.scene.fishSize==='big' ? 3 : 2.2);
  else if(st==='lost' || st==='reel') warp *= 1.6;
  // 每 2 帧重算列偏移，复用降低开销；后台不跑扭曲
  if(!PX.bg && (PX.reflAge >= 2 || !PX.reflCols)){
    if(!PX.reflCols || PX.reflCols.length !== PX.W) PX.reflCols = new Float32Array(PX.W);
    const sp = 0.16 * (sk.rockSpd || 0.5);
    for(let x=0;x<PX.W;x++){
      // 宽幅下降低空间频率，避免 720 列出现高频锯齿
      PX.reflCols[x] = Math.sin(x*0.024 + PX.frame*sp) * warp
                     + Math.sin(x*0.0092 - PX.frame*sp*0.6) * warp*0.6;
    }
    PX.reflAge = 0;
  }
  PX.reflAge++;
  const cols = PX.reflCols;
  // 倒影区 = 地平线→水面线之间的「远水面」。参考图是镜面级反射：
  // 天空色 → 远山倒影 → 林带倒影，全部上下翻转并按深度衰减，
  // 逐列横向位移制造波纹断裂感。clip 必须覆盖 hz..wl，否则透黑底。
  const skyTint = pxMix(sk.sky[2], '#ffffff', 0.18);
  const nearTop = pxMix(sk.waterTop, skyTint, 0.72);      // 靠近地平线：天光最亮
  const nearBottom = pxMix(sk.waterTop, sk.waterMid, 0.45);
  const dim  = pxMix(sk.waterTop, '#050c12', 0.45);
  const dim2 = pxMix(sk.waterMid, '#050c12', 0.30);
  c.save();
  c.beginPath(); c.rect(0, hz, PX.W, depth); c.clip();
  // 自地平线向下做垂直渐变（分 8 段色带，天光反射衰减）
  const SEG = 8;
  for(let i=0;i<SEG;i++){
    const k = i/(SEG-1);
    pxRect(0, hz + depth*i/SEG, PX.W, Math.ceil(depth/SEG)+1, pxMix(nearTop, nearBottom, k));
  }
  // 日光晕在水面的反射（垂直拉长的暖色亮柱，参考图湖面有落日倒影柱）
  if(sk.sun && !PX.bg){
    const sx = Math.round(sk.sun.x * PX.W);
    const halfW = 34;
    for(let i=0;i<depth;i++){
      const k = i/depth;
      const a = sk.sun.a * (0.42 - k*0.34);
      if(a <= 0.004) continue;
      c.globalAlpha = a;
      // 逐行横向抖动 = 水面波光柱
      const wj = Math.sin(PX.frame*0.16 + i*0.42) * 7;
      pxRect(sx - halfW + wj, hz + i, halfW*2, 1, pxMix(sk.sun.col, '#ffffff', 0.35));
    }
    c.globalAlpha = 1;
  }
  const T = sk.trees;
  for(let x=0;x<PX.W;x++){
    const yo = Math.round(cols ? cols[x] : 0);
    const sx = Math.max(0, Math.min(PX.W-1, x + yo));
    /* 远山倒影：自地平线向下延展，深色半透明，随轮廓起伏 */
    const profH = Math.abs(pxFarProfile(sk.far, x));
    const rl = Math.min(depth*0.9, Math.max(4, profH*0.5 + 5));
    c.globalAlpha = 0.40;
    pxRect(sx, hz, 1, Math.round(rl), pxMix(dim, dim2, Math.min(1, rl/depth)));
    c.globalAlpha = 1;
    /* 林带倒影：松林在地平线附近的原色倒影（参考图岸边树在水中有明显倒影） */
    if(T){
      const n1 = Math.sin(x*0.0173)*0.5 + Math.sin(x*0.0411+1.3)*0.3 + Math.sin(x*0.0892+2.7)*0.2;
      const dens = Math.abs(n1);
      if(dens >= 0.30){
        const hgt = Math.round(7 + dens*22 + Math.abs(Math.sin(x*0.213))*4);
        const tl = Math.min(depth*0.62, Math.max(3, hgt*0.42));   // 倒影比实体短
        const k = Math.min(1, hgt/30);
        let tcol = pxMix(T.far, T.near, k);
        const autumnSeed = (Math.sin(x*0.0563+0.7)+Math.sin(x*0.121+2.1))*0.5;
        if(autumnSeed > (1 - T.autumn*2) && T.autumn > 0){
          tcol = pxMix(tcol, '#c4772f', 0.55 + T.autumn*0.35);
        }
        c.globalAlpha = 0.30;
        pxRect(sx, hz, 1, Math.round(tl), tcol);
        c.globalAlpha = 1;
      }
    }
    /* 水面高光线（随位移抖动，制造波纹切割感） */
    if((x + Math.round(yo*0.7) + PX.frame) % 11 === 0){
      pxPix(sx, hz + 1 + ((PX.frame + x) % 3), pxMix(sk.waterTop, '#ffffff', 0.42));
    }
  }
  c.restore();
}

/* =========================================================================
   水下层 + 水下鱼群
   ========================================================================= */
/** 下水体：分层半透明，保证鱼群可见 */
function pxDrawUnderwater(){
  const sk = pxSkin(), c = PX.ctx;
  const wl = PX.L.waterY, H = PX.H;
  // 上水体（水面线到中线）
  pxBand(wl, wl + (H-wl)*0.42, sk.waterTop, sk.waterMid, 8);
  // 深水层
  pxBand(wl + (H-wl)*0.42, H, sk.waterMid, sk.waterDeep, 10);
  // 环境光叠加
  if(sk.glow){ c.fillStyle = sk.glow; c.fillRect(0, wl, PX.W, H-wl); }
  // 水体通透感：靠近水面的浅色带
  c.fillStyle = pxMix(sk.waterTop, '#ffffff', 0.10);
  c.globalAlpha = 0.5;
  c.fillRect(0, wl, PX.W, 4);
  c.globalAlpha = 1;
}
/** 水面线（硬像素 2px 过渡） */
function pxDrawWaterLine(){
  const sk = pxSkin();
  const wl = PX.L.waterY;
  pxRect(0, wl-1, PX.W, 1, pxMix(sk.waterTop, '#ffffff', 0.22));
  pxRect(0, wl, PX.W, 1, pxMix(sk.waterTop, '#000000', 0.22));
}
/** 水面波纹（柔和细线，宽幅下跨度加大，横向铺满） */
function pxRipples(y0, count, amp, speed, color){
  const sk = pxSkin();
  const col = color || pxMix(sk.waterTop, '#ffffff', 0.16);
  for(let i=0;i<count;i++){
    const yy = y0 + i*6;
    const w = 22 + ((PX.frame*speed + i*29) % 58);
    const x = ((PX.frame*speed*0.6 + i*83) % (PX.W - w)) | 0;
    pxRect(x, yy, w, 1, col);
    if(amp>1){
      const x2 = ((PX.frame*speed*0.4 + i*127 + 140) % (PX.W - 14)) | 0;
      pxRect(x2, yy+1, 14, 1, col);
      const x3 = ((PX.frame*speed*0.5 + i*61 + 320) % (PX.W - 10)) | 0;
      pxRect(x3, yy+2, 10, 1, col);
    }
  }
}
/** 烟雾/雾气层：按 skin.mist 分暖雾 / 冷雾 / 厚重雾 / 生物荧光 */
function pxDrawMist(){
  const sk = pxSkin(), c = PX.ctx, t = PX.frame;
  const wl = PX.L.waterY;
  if(PX.bg) return;                       // 后台不画雾气细节
  const hz = PX.L.horizon;
  if(sk.mist==='warm' || sk.mist==='cool'){
    const tint = sk.mist==='warm' ? 'rgba(255,214,170,' : 'rgba(200,230,250,';
    // 雾气铺在地平线以上的天空区，越靠近地平线越淡，避免在水面附近形成亮带
    for(let i=0;i<8;i++){
      const k = i/7;                                   // 0=高空 → 1=近地平线
      const a = (0.030 + Math.sin(t*0.03 + i*1.3)*0.012) * (1 - k*0.55);
      const y = hz - 54 + i*7;
      pxRect(0, y, PX.W, 6, tint + Math.max(0.004, a).toFixed(3) + ')');
    }
  } else if(sk.mist==='heavy'){
    for(let i=0;i<12;i++){
      const k = i/11;
      const a = (0.028 + Math.sin(t*0.02 + i*1.1)*0.012) * (1 - k*0.6);
      const y = hz - 78 + i*7;
      pxRect(0, y, PX.W, 7, 'rgba(160,180,190,' + Math.max(0.004, a).toFixed(3) + ')');
    }
  } else if(sk.mist==='bio'){
    // 生物荧光粒子（缓慢上浮的亮点，柔和无闪光；宽幅下铺满深水区）
    for(let i=0;i<34;i++){
      const ph = (t*0.35 + i*23) % 240;
      const x = Math.round((i*23 + Math.sin(t*0.02+i)*20) % PX.W);
      const y = Math.round(wl + 14 + ph*0.62);
      if(y < PX.H-3){
        const a = 0.35 + Math.sin(t*0.06+i)*0.18;
        c.fillStyle = 'rgba(120,215,240,' + Math.max(0.08,a).toFixed(2) + ')';
        c.fillRect(x, y, 2, 2);
      }
    }
  }
}
/** 水下鱼影（半透明，缓慢游动） */
function pxFishBody(cx,cy,col,flip,size){
  const w = size==='big' ? 26 : 15;
  const c = PX.ctx;
  c.globalAlpha = 0.62;
  pxRect(cx, cy, w, 7, col);
  pxRect(cx-7, cy+2, 7, 4, col);          // 尾
  pxRect(cx+w-3, cy+2, 5, 4, col);
  c.globalAlpha = 1;
}

/* =========================================================================
   船只载具（6 种渔场专属）+ 钓手 / 鱼竿 / 浮漂
   钓手与鱼竿在船的局部坐标系内绘制 → 切场时保持连续，不重建。
   ========================================================================= */
/** 计算本帧船体姿态：浮沉 bobY、倾斜 tiltDeg、横向漂移 driftX */
function pxBoatPose(){
  const sk = pxSkin(), s = PX.scene;
  const t = PX.frame * (sk.rockSpd || 0.5);
  const amp = sk.rock || 1;
  // 基础浮沉
  let bob = Math.sin(t*0.35) * (1.6*amp);
  // 基础摇摆（缓幅）
  let tilt = Math.sin(t*0.28) * (0.55*amp);
  // 咬钩拉锯：持续倾斜 + 阻尼振荡余摆
  if(s.state==='bite'){
    const pull = s.fishSize==='big' ? 9 : (s.fishSize==='mid' ? 4 : 1.6);
    tilt += Math.sin(PX.frame*0.55) * pull * 0.32;
    bob += Math.sin(PX.frame*0.7) * pull * 0.22;
  } else if(s.state==='reel' || s.state==='lost'){
    tilt += Math.sin(PX.frame*0.4) * 2.2;
  }
  // 阻尼振荡余摆（指数衰减）
  tilt += PX.sway * 0.6;
  bob += PX.sway * 0.35;
  // 水流漂移（皮划艇）
  let drift = 0;
  if(sk.drift){
    drift = Math.sin(PX.frame * 0.012) * 10;   // 缓慢横移
  }
  return { bob, tilt, drift };
}
/** 船体统一包装：应用浮沉 / 倾斜 / 漂移 + 宽幅缩放后绘制船型，并在船内叠加钓手与同伴。
 *  参考图：深褐木船，舷侧木纹清晰，内舱掏空，钓手坐中偏后，船头有小狗。 */
function pxDrawBoat(){
  const sk = pxSkin(), c = PX.ctx;
  const pose = pxBoatPose();
  const f = PX.fade.a;                    // 切场淡入淡出
  if(f <= 0.01) return;
  /* ---- 船体水中倒影（先画，位于船之下方，波纹横向切割） ---- */
  if(!PX.bg) pxDrawBoatReflect(sk, pose, f);
  c.save();
  c.globalAlpha = f;
  c.translate(PX.L.boatX + pose.drift, PX.L.boatY + pose.bob);
  c.rotate(pose.tilt * Math.PI / 180);
  c.scale(PX.boatScale, PX.boatScale);    // 720 宽画幅下船体整体放大
  // 船体
  const fn = {
    skiff:   pxBoatSkiff,   kayak: pxBoatKayak,  trawler: pxBoatTrawler,
    steel:   pxBoatSteel,   canoe: pxBoatCanoe,  abyssrig: pxBoatAbyssRig,
  }[sk.boat] || pxBoatSkiff;
  fn(sk.boatPal);
  // 钓手 + 鱼竿 + 手部坐标（相对船心）
  pxDrawAnglerOnBoat(sk);
  // 船头同伴（小狗）：仅新手池塘 / 溪流 / 碧湖等休闲渔场出现
  pxDrawDog(sk, pose);
  c.restore();
  // 恢复透明度后统一由调用方继续画浮漂/鱼线
  return pose;
}
/** 船体水中倒影：竖直翻转的深色船影 + 逐行横向抖动（水面波光切割） */
function pxDrawBoatReflect(sk, pose, f){
  const c = PX.ctx;
  const bx = PX.L.boatX + pose.drift;
  const by = PX.L.boatY + pose.bob;
  const sc = PX.boatScale;
  c.save();
  c.globalAlpha = f * 0.30;
  const w = 68 * sc, h = 15 * sc;
  for(let i=0;i<h;i++){
    // 逐行横向抖动 + 向下淡出，模拟波浪切割的倒影
    const k = i/h;
    const wob = Math.sin(PX.frame*0.14 + i*0.5) * (2.2 + k*3.4);
    const ww = Math.round(w * (1 - k*0.32));
    c.globalAlpha = f * 0.30 * (1 - k*0.72);
    pxRect(bx - ww/2 + wob, by + 8*sc + i, ww, 1, pxMix(sk.waterMid, '#050c12', 0.42));
  }
  // 钓手倒影（窄一些的深色竖影）
  c.globalAlpha = f * 0.22;
  for(let i=0;i<Math.round(20*sc);i++){
    const k = i/(20*sc);
    const wob = Math.sin(PX.frame*0.16 + i*0.55) * (2 + k*3);
    c.globalAlpha = f * 0.22 * (1 - k*0.7);
    pxRect(bx + (16*sc) + wob, by + 8*sc + i, Math.round(9*sc), 1, '#0d1a22');
  }
  c.restore();
}
/** 钓手在船坐标系内的站位偏移（供 pxDrawRod 换算世界坐标，随缩放同步） */
const ANGLER_OFF = { x:8, y:-30 };
/** 钓手（在船坐标系内：船心为原点）
 *  参考图：橙红救生衣、深色帽、身体略前倾、双手握竿。 */
function pxDrawAnglerOnBoat(sk){
  const bx = 8, by = -34;                  // 相对船心的站位（船中偏后）
  // 腿（前倾坐姿：膝盖抬起）
  pxRect(bx+1, by+21, 4, 10, '#2f3d47');   // 后腿
  pxRect(bx+8, by+18, 4, 9,  '#384752');   // 前腿（抬起）
  pxRect(bx+9, by+26, 5, 3,  '#242f36');   // 鞋
  // 躯干：橙红救生衣（参考图最醒目的色块）
  pxRect(bx, by+9, 12, 15, '#c4482c');     // 救生衣主体
  pxRect(bx, by+9, 4, 15, '#a83a22');      // 左侧暗面
  pxRect(bx+4, by+12, 5, 3, '#e0663f');    // 胸前反光条
  pxRect(bx+4, by+19, 5, 2, '#e0663f');
  pxRect(bx, by+9, 12, 2, '#e0603a');      // 肩部提亮
  // 领口 / 内搭
  pxRect(bx+3, by+7, 6, 3, '#5a6670');
  // 头
  pxRect(bx+2, by, 9, 9, PAL.skin);
  pxRect(bx+2, by-2, 9, 4, '#2f3b42');     // 帽子
  pxRect(bx+10, by+5, 1, 1, '#2f3b42');    // 眼
  pxRect(bx+2, by-4, 9, 2, '#3d4a52');     // 帽檐
  // 手臂（双手前伸向竿柄，前倾姿态）
  pxRect(bx+10, by+12, 7, 3, '#c4482c');   // 上臂（救生衣同色）
  pxRect(bx+15, by+13, 5, 3, PAL.skin);    // 前臂裸露
}
/** 船头同伴：浅棕小狗（坐姿，尾巴轻摇，耳朵随船身摆动）
 *  参考图船头有一只浅色小狗伴随，是本场景的标志性细节。 */
function pxDrawDog(sk, pose){
  // 仅休闲渔场带狗，工业船 / 深渊船不带
  const b = sk.boat;
  if(!(b==='skiff' || b==='kayak' || b==='canoe')) return;
  const dx = 31, dy = -42;                 // 船头位置（相对船心，与钓手留出间隙）
  const t = PX.frame;
  // 尾巴（左右摇摆，船越晃摆得越明显）
  const wag = Math.sin(t*0.34) * (2 + Math.abs(pose.tilt)*0.5);
  const twx = Math.round(dx + 9 + wag), twy = dy + 14;
  pxRect(twx, twy, 2, 2, '#c79a63');
  pxRect(Math.round(dx + 9 + wag*0.6), twy+2, 2, 2, '#b8894f');
  // 后腿 / 臀部
  pxRect(dx+5, dy+11, 8, 8, '#d8ab72');
  // 身体（坐姿，前胸挺起）
  pxRect(dx+2, dy+4, 11, 9, '#e2b87e');
  pxRect(dx+2, dy+9, 11, 3, '#c79a63');    // 腹部阴影
  // 前腿（直立撑在船板上）
  pxRect(dx+3, dy+12, 3, 6, '#e2b87e');
  pxRect(dx+8, dy+12, 3, 6, '#e2b87e');
  pxRect(dx+3, dy+17, 3, 2, '#8a6a42');    // 爪
  pxRect(dx+8, dy+17, 3, 2, '#8a6a42');
  // 头（朝向左前方看水面）
  pxRect(dx-1, dy-3, 9, 8, '#eec38a');
  pxRect(dx-4, dy+1, 4, 3, '#d8ab72');     // 口鼻前突
  pxRect(dx-4, dy, 2, 2, '#8a6a42');       // 鼻
  pxRect(dx+2, dy-1, 1, 1, '#2a1f16');     // 眼
  pxRect(dx+3, dy-1, 1, 1, '#2a1f16');
  // 耳朵（随船摆动轻晃）
  const ear = Math.round(Math.sin(t*0.26)*1);
  pxRect(dx+1, dy-5+ear, 3, 4, '#b8894f'); // 左耳（垂耳）
  pxRect(dx+5, dy-5-ear, 3, 4, '#c79a63'); // 右耳
  // 佩戴项圈（红色，呼应钓手救生衣）
  pxRect(dx-1, dy+4, 9, 2, '#c4482c');
}
/** 鱼竿：从船上持竿手位置按角度延伸（世界坐标），返回竿梢坐标。
 *  参考图特征：竿身很长、大角度斜向上指向左侧、竿梢明显弯垂成弧。 */
function pxDrawRod(){
  const pose = PX._pose || {bob:0, tilt:0, drift:0};
  const sc = PX.boatScale;
  // 手部世界坐标 = 船心 + 旋转后的（缩放后）站位偏移
  const rad = pose.tilt * Math.PI/180;
  const ox = ANGLER_OFF.x * sc, oy = ANGLER_OFF.y * sc;
  const lx = (PX.L.boatX + pose.drift) + ox*Math.cos(rad) - oy*Math.sin(rad);
  const ly = (PX.L.boatY + pose.bob)   + ox*Math.sin(rad) + oy*Math.cos(rad);
  const handX = Math.round(lx + 14*sc), handY = Math.round(ly + 6*sc);
  const ang = PX._rodAngle || 208;
  const len = 112 * sc;                     // 竿身加长（参考图竿占画面约 1/3 宽）
  const a = (ang) * Math.PI/180;
  const ex = Math.round(handX + Math.cos(a)*len);
  const ey = Math.round(handY + Math.sin(a)*len);
  const pull = (PX._rodPull || 0) * sc;
  const steps = Math.round(len * 1.2);
  // 竿身：基础弯垂 4px（自重微垂）+ 受力 pull
  const baseSag = 4 * sc;
  for(let i=0;i<=steps;i++){
    const k = i/steps;
    // 弯曲量随竿长二次增长（越靠竿梢越弯）
    const sag = (baseSag + pull) * Math.pow(k, 1.7);
    const xx = Math.round(handX + (ex-handX)*k);
    const yy = Math.round(handY + (ey-handY)*k + sag);
    // 竿体渐变：根部深褐 → 竿梢浅棕（参考图竿有明暗过渡）
    pxPix(xx, yy, pxMix('#4a3524', PAL.rod, Math.min(1, k*1.6)));
    if(k > 0.18) pxPix(xx, yy+1, pxMix('#2f2216', '#6d533a', k*0.9));  // 竿下缘阴影
    // 导环（每隔一段一个亮点）
    if(i % 22 === 0 && i > 0) pxPix(xx, yy-1, '#c9a86a');
  }
  // 竿柄握把
  pxRect(handX-2, handY-1, 6, 4, '#2f2216');
  PX._handX = handX; PX._handY = handY;
  PX._rodEx = ex; PX._rodEy = ey;
  return {ex, ey};
}
/** 鱼线（从竿梢到目标，1px 浅白，带垂度） */
function pxDrawLine(x1,y1,x2,y2,sag){
  const steps = Math.max(1, Math.round(Math.hypot(x2-x1, y2-y1)));
  for(let i=0;i<=steps;i++){
    const k = i/steps;
    pxPix(Math.round(x1 + (x2-x1)*k), Math.round(y1 + (y2-y1)*k + Math.sin(k*Math.PI)*(sag||0)), '#dceaf2');
  }
}
/** 浮漂（不受淡出影响：切场时保持连续） */
/** 浮漂（宽幅下适度放大，仍为硬像素；不受切场淡出影响） */
function pxDrawBobber(x,y,dy,color){
  const c = color || PAL.bobber;
  pxRect(x, y+dy-2, 6, 2, '#ffd9a0');
  pxRect(x, y+dy, 6, 9, c);
  pxRect(x, y+dy+9, 6, 3, '#ffffff');
  pxRect(x+2, y+dy+12, 2, 2, '#5a3a10');
}
/** 柔和粒子池（无高频闪光，挂机长时间观看舒适）
    宽幅下水花扩散面积更大，池容量提升到 260 */
PX.P = [];
for(let i=0;i<260;i++) PX.P.push({alive:false,x:0,y:0,vx:0,vy:0,life:0,max:0,col:'#fff',sz:1});
function pxClearParticles(){ for(let i=0;i<PX.P.length;i++) PX.P[i].alive = false; }
/** 图像模式的常驻水面动效（波光呼吸 + 船边涟漪），由 pxSetScene 写入，
 *  与场景动作无关 → 保证画面任何时刻都在动。 */
let SHIMMER = {
  rows:  [5.20, 1.73, 4.15, 2.60, 3.05],      // 每行相位（行间距随机化）
  speed:[-1.30, 0.70, -0.55, 1.10, -0.90],    // 横向流速（正负交替）
  alpha:[0.30, 0.18, 0.26, 0.15, 0.22],
  breathAmp: 3.0, breathSpd: 0.055,
};
function pxReseedShimmer(){
  const rnd = (a,b)=>a+Math.random()*(b-a);
  SHIMMER.rows  = [rnd(3,6), rnd(1.2,3.4), rnd(3.4,6.5), rnd(2.2,3.2), rnd(2.6,5.6)];
  SHIMMER.speed = [rnd(-1.7,-0.5), rnd(0.4,1.5), rnd(-1.4,-0.3), rnd(0.5,1.6), rnd(-1.5,-0.4)];
  SHIMMER.alpha = [rnd(0.26,0.40), rnd(0.12,0.22), rnd(0.20,0.33), rnd(0.10,0.20), rnd(0.16,0.28)];
  SHIMMER.breathAmp = rnd(2.0, 4.2);
  SHIMMER.breathSpd = rnd(0.042, 0.070);
}
/** 发射柔和水花粒子：power 控制数量，spread 控制散开角度 */
function pxEmit(cx, cy, power, spread, col){
  const budget = PX.bg ? 0.45 : 1;
  const n = Math.max(1, Math.round(power * budget));
  const base = col || '#cfe8f5';
  let made = 0;
  for(let i=0;i<PX.P.length && made<n;i++){
    const p = PX.P[i];
    if(p.alive) continue;
    const a = -Math.PI/2 + (Math.random()-0.5) * (spread || Math.PI*0.9);
    const sp = 0.5 + Math.random()*1.6 * (0.6 + power*0.06);
    p.alive = true; p.x = cx; p.y = cy;
    p.vx = Math.cos(a)*sp; p.vy = Math.sin(a)*sp - 0.3;
    p.life = 0; p.max = 16 + Math.round(Math.random()*14);
    p.col = Math.random()<0.35 ? '#ffffff' : base;
    p.sz = Math.random()<0.3 ? 2 : 1;
    made++;
  }
}
function pxStepParticles(){
  if(PX.bg){ /* 后台仅推进不绘制 */ }
  for(let i=0;i<PX.P.length;i++){
    const p = PX.P[i];
    if(!p.alive) continue;
    p.life++;
    if(p.life > p.max){ p.alive = false; continue; }
    p.vy += 0.055;                    // 轻微重力
    p.vx *= 0.965; p.vy *= 0.965;     // 阻尼
    p.x += p.vx; p.y += p.vy;
    if(p.y > PX.H-1){ p.alive = false; continue; }
    if(PX.bg) continue;
    const k = 1 - p.life/p.max;
    const c = PX.ctx;
    c.globalAlpha = Math.max(0.05, k*0.85);
    pxRect(p.x, p.y, p.sz, p.sz, p.col);
    c.globalAlpha = 1;
  }
}

/* =========================================================================
   主绘制：分层管线
   远景山林 → 水面层 → 倒影层 → 水下层 → 船/钓手/竿/漂 → 粒子
   ========================================================================= */
function pxDraw(){
  const c = PX.ctx; if(!c) return;
  PX.frame++;
  const s = PX.scene; s.t++;
  const W = PX.W, H = PX.H, sk = pxSkin();
  const t = PX.frame;

  // 阻尼振荡衰减
  PX.swayV += -PX.sway * 0.06;      // 弹性回正
  PX.swayV *= 0.90;                 // 阻尼
  PX.sway  += PX.swayV;
  if(Math.abs(PX.sway) < 0.002) PX.sway = 0;

  // 淡入淡出推进
  const f = PX.fade;
  if(f.dir !== 0){
    f.a += f.dir * 0.13;
    if(f.a <= 0){                       // 淡出完成 → 替换皮肤
      f.a = 0;
      if(f.pending){ pxApplySpot(f.pending); f.pending = null; }
      f.dir = 1;
    } else if(f.a >= 1){                // 淡入完成
      f.a = 1; f.dir = 0;
    }
  }

  // ---- 底图模式：AI 参考图 + 实时动效叠加（六分镜共用底图） ----
  const imgReady = PX.imgMode && PX.bgImg.complete && PX.bgImg.naturalWidth > 0;
  if(imgReady){
    pxDrawBgImage(sk);
    pxDrawWaterGlimmer(sk);
    // 活狗覆盖层已停用：直接显示底图里原本那只狗（用户要求还原原样）
    // pxDrawImgDog();
  } else {
    // ---- 层 1：远景 + 中景 ----
    pxDrawFar();
    // ---- 层 2：上水体 / 水面线 ----
    pxDrawUnderwater();
    pxDrawWaterLine();
    // ---- 层 3：倒影（随波纹扭曲） ----
    pxReflect();
    // ---- 层 4：雾气 / 生物荧光 ----
    pxDrawMist();
    // ---- 层 5：水下鱼群（常驻游动，半透明） ----
    pxDrawUnderFish();
    if(!PX.bg) pxRipples(PX.L.waterY + 3, 4, 1, 0.5);
  }

  // ---- 层 7：船 + 钓手 + 鱼竿 + 浮漂（前景主体，随场景切换动画） ----
  if(imgReady) pxDrawSceneImg();
  else pxDrawScene();

  // ---- 层 8：粒子特效 ----
  pxStepParticles();

  // ---- 层 9：钓获高光弹窗（传说 / 神隐） ----
  pxPopupDraw();

  pxSyncWindowCls();
}

/* =========================================================================
   图像底图模式：六分镜实时动画叠加
   底图提供 天空/远山/秋林/水面/船/钓手/狗，
   本段实时绘制 竿 / 线 / 浮漂 / 水下鱼 / 出水鱼 / 巨物 / 水花 / 涟漪。
   坐标锚点：水面线 PX.L.surfY=285，持竿点 (494,238)，浮漂 x=230。
   ========================================================================= */

/** 底图水体色调覆盖：让底图适配 6 个渔场的气色（轻量色罩，非重绘） */
const IMG_TINT = {
  pond:   { col:'rgba(150,190,150,0.13)', dark:'rgba(20,40,30,0.10)' },
  river:  { col:'rgba(130,180,215,0.14)', dark:'rgba(16,34,48,0.12)' },
  lake:   { col:'rgba(255,160,110,0.06)', dark:'rgba(30,20,50,0.04)' },
  deep:   { col:'rgba(90,140,190,0.20)',  dark:'rgba(8,20,32,0.20)' },
  canyon: { col:'rgba(120,140,150,0.22)', dark:'rgba(8,14,18,0.34)' },
  abyss:  { col:'rgba(60,120,170,0.26)',  dark:'rgba(4,10,18,0.42)' },
};

/** 绘制底图：镜头固定（整图不再随浪起伏/倾斜），只叠渔场色罩。
 *  画面的“活着感”改由水面波光、竿线摆动与浮漂承担，避免坐船般的整体晃动。 */
function pxDrawBgImage(sk){
  const c = PX.ctx;
  // 镜头固定：底图不再随浪起伏/倾斜。
  // 原实现的整图位移（主涌浪 3.4px + 细碎波纹 1.3px，叠加约 0.45° 倾斜）
  // 会让整个场景像"坐在船上被晃"，这里统一归零，只保留水面自身的波光。
  const bob = 0, tilt = 0;
  PX.bgBob = bob; PX.bgTilt = tilt;
  const sel = IMG_TINT[sk.id] || IMG_TINT.lake;

  c.save();
  // 放大 1.06 倍以留出位移与倾斜余量，避免出现边缘空隙
  c.translate(PX.W/2, PX.H/2 + bob);
  c.rotate(tilt * Math.PI/180);
  c.scale(1.06, 1.06);
  c.drawImage(PX.bgImg, -PX.W/2, -PX.H/2, PX.W, PX.H);
  c.restore();

  // 渔场气色罩：先整体色调，再由深到浅压暗水下
  c.globalAlpha = 1;
  c.fillStyle = sel.col; c.fillRect(0, 0, PX.W, PX.H);
  const grad = c.createLinearGradient(0, PX.L.surfY - 10, 0, PX.H);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, sel.dark);
  c.fillStyle = grad; c.fillRect(0, PX.L.surfY - 10, PX.W, PX.H - PX.L.surfY + 10);

  // 区域暗角
  const vg = c.createRadialGradient(PX.W*0.5, PX.H*0.52, PX.H*0.34,
                                    PX.W*0.5, PX.H*0.52, PX.W*0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.30)');
  c.fillStyle = vg; c.fillRect(0, 0, PX.W, PX.H);
}

/** 水面波光：底图水面上的持续动态波纹（横移高光 + 竖向呼吸）
 *  实现要点：高光带横跨整幅水面（而不是被随机取模截成小段），
 *  流速正负交替 + 竖向呼吸 → 任何时刻都有大面积水面在变，肉眼必然可见。 */
function pxDrawWaterGlimmer(sk){
  const c = PX.ctx;
  const y0 = PX.L.surfY - 3, y1 = PX.H;
  const span = y1 - y0;
  if(PX.bg) return;
  const gcol = sk.sun ? pxMix(sk.sun.col, '#ffffff', 0.62) : '#f2fbff';
  /* 1) 五条主波光带：横跨全宽，每条以不同速度/方向流动，并整体上下呼吸 */
  for(let r=0; r<SHIMMER.rows.length; r++){
    const breath = Math.sin(PX.frame * SHIMMER.breathSpd + r*1.7) * SHIMMER.breathAmp;
    const baseY = y0 + span * (SHIMMER.rows[r] / 6.5);
    const y = Math.round(baseY + breath);
    const spd = SHIMMER.speed[r];
    const a = SHIMMER.alpha[r];
    /* 沿宽度铺一串长短不一的高光段（用连续推进的偏移制造整体横移） */
    let x = -60 + ((PX.frame * spd * 1.6) % 120);
    const dashPattern = [42, 18, 66, 26, 34, 54, 22, 48, 30, 40];
    let pi = 0;
    while(x < PX.W + 60){
      const w = dashPattern[pi % dashPattern.length];
      const px0 = Math.round(x), pw = Math.round(w);
      if(px0 + pw > 0 && px0 < PX.W){
        c.globalAlpha = a;
        pxRect(px0, y, pw, 2, gcol);
        c.globalAlpha = a * 0.55;
        pxRect(px0 + 3, y - 1, Math.max(2, pw - 6), 1, gcol);      // 上缘细亮线（波峰）
        c.globalAlpha = 1;
      }
      x += w + 26;
      pi++;
    }
  }
  /* 2) 反向细碎波纹（更密、更细，制造水面交织质感） */
  for(let i=0;i<30;i++){
    const y = y0 + 3 + ((i * 1.87) % (span - 3));
    const w = 16 + ((i*37) % 40);
    const x = ((PX.W + 80 - i*53 - PX.frame*0.85) % (PX.W + w)) - w;
    c.globalAlpha = 0.11 + (i%3)*0.035;
    pxRect(Math.round(x), Math.round(y), w, 1, '#d8ebf8');
    c.globalAlpha = 1;
  }
  /* 3) 船体周围扩散的涟漪（随船起伏呼吸） */
  const bx = 452, by = PX.L.surfY + 6 + PX.bgBob*0.5;
  for(let i=0;i<4;i++){
    const rr = 24 + i*14 + Math.sin(PX.frame*0.075 + i*1.2)*5.5;
    c.globalAlpha = 0.22 - i*0.038;
    for(let g=0; g<26; g++){
      const ang = Math.PI*0.03 + g/26 * Math.PI*0.94;
      pxPix(Math.round(bx + Math.cos(ang)*rr*1.95), Math.round(by + Math.sin(ang)*rr*0.34), '#e2f2fd');
    }
    c.globalAlpha = 1;
  }
  /* 4) 远景水面粼粼光点（闪烁） */
  for(let i=0;i<34;i++){
    const ph = (PX.frame * 0.07 + i * 0.37) % 1;
    if(ph > 0.45) continue;
    const x = (i * 79 + 13) % PX.W;
